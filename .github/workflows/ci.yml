name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test Matrix (javac 8/11/17/21/25)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchain JDKs (8/11/17/21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            11
            17
            21

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Test Suites
        run: |
          chmod +x gradlew
          export JAVA_HOME="$JAVA_HOME_25_X64"
          echo "runner JAVA_HOME=$JAVA_HOME"
          java -version
          # fullCheck = check（JUnit + 文本扫描）+ e2eProbe（独立 JVM / Agent / Kotlin 差分）。
          # 本地日常只跑 check，提交前与 CI 跑全量，避免丢掉探针覆盖。
          ./gradlew fullCheck \
            -Dhstest.requireJdks=true \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/test-results
            **/build/reports
          if-no-files-found: ignore

  test-dcevm:
    name: Test on DCEVM (JBR 21)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchain JDKs (8/11/17)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            11
            17

      - name: Set up JetBrains Runtime 21 (DCEVM)
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Live DCEVM Tests
        run: |
          chmod +x gradlew
          export JAVA_HOME="$JAVA_HOME_25_X64"
          echo "runner JAVA_HOME=$JAVA_HOME"
          echo "JBR 21 JAVA_HOME=$JAVA_HOME_21_X64"
          ./gradlew :tests:liveDcevmTest \
            -Dhstest.requireJdks=true \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false

  p05-probe:
    name: P0.5 Probe (JBR ${{ matrix.jbr }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        jbr: [ '17', '21' ]
    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchain JDKs (8/11/17/21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            11
            17
            21

      - name: Set up JetBrains Runtime ${{ matrix.jbr }} (DCEVM)
        id: jbr
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: ${{ matrix.jbr }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 堆遍历规模测量需要 Linux x64 的 JVMTI 底座
      - name: Build native libtool (Linux x64)
        run: |
          mkdir -p core/libs
          g++ -shared -fPIC -std=c++2b -O3 \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            core/cpp/tool.cpp -o core/libs/libtool64.so

      - name: Run P0.5 probe
        run: |
          chmod +x gradlew
          export JAVA_HOME="$JAVA_HOME_25_X64"
          echo "runner JAVA_HOME=$JAVA_HOME"
          echo "probe JAVA_HOME=${{ steps.jbr.outputs.path }}"
          ./gradlew :tests:p05Probe -Pp05.jbr="${{ steps.jbr.outputs.path }}" \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false

      - name: Run two-phase probe
        run: |
          export JAVA_HOME="$JAVA_HOME_25_X64"
          ./gradlew :tests:twoPhaseProbe -Pp05.jbr="${{ steps.jbr.outputs.path }}" \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false

  build-native:
    name: Build Native Libraries (Linux x64 & Android arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Compile Linux x86_64 (.so)
        run: |
          mkdir -p core/libs
          g++ -shared -fPIC -std=c++2b -O3 \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            core/cpp/tool.cpp -o core/libs/libtool64.so
          ls -la core/libs/libtool64.so

      - name: Compile Android arm64-v8a (.so)
        run: |
          if [ -z "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            export ANDROID_NDK_HOME=$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          fi
          echo "Using Android NDK: $ANDROID_NDK_HOME"
          
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++ \
            -shared -fPIC -static-libstdc++ -std=c++2b -O3 \
            -Icore/cpp/jni_posix \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            core/cpp/tool.cpp -o core/libs/libtoolarm64.so
          ls -la core/libs/libtoolarm64.so

      - name: Verify native ABIs
        # Linux aarch64 产物与 Windows/macOS 产物一样随仓库分发（core/cpp/compile.bat 用 zig
        # aarch64-linux-gnu.2.17 生成），CI 只校验、不重建：zig c++ 的链接阶段会从源码构建它
        # 内置的 libc++，该内部构建不受 -w 控制，会在第三方头文件里刷出数千条
        # -Wnullability-completeness 注解——那正是把 aarch64 构建搬进 CI 后引入的噪声。
        # 校验项：glibc 构建（libc.so.6 + libpthread.so.0）、aarch64 glibc 基线 2.17、不是 bionic。
        run: |
          test -s core/libs/libtoolaarch64.so
          test -s core/libs/libtoolarm64.so
          readelf -h core/libs/libtoolaarch64.so | grep -F 'AArch64'
          readelf -d core/libs/libtoolaarch64.so | grep -F 'libc.so.6'
          readelf -d core/libs/libtoolaarch64.so | grep -F 'libpthread.so.0'
          readelf -d core/libs/libtoolarm64.so | grep -F '[libc.so]'
          ! readelf -V core/libs/libtoolaarch64.so | grep -E 'GLIBC_2\.(1[89]|[2-9][0-9])'

      - name: Upload Native Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: native-libraries
          path: |
            core/libs/*.so
          if-no-files-found: error

  build-jars:
    name: Build Distributable Jars
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Distributions and Jars
        # 与 release.yml 的发版构建同一条命令：CI 产物与发版资产同源，
        # 避免"CI 上能跑的 jar 不是最终发的那个"。
        run: |
          chmod +x gradlew
          export JAVA_HOME="$JAVA_HOME_25_X64"
          ./gradlew assemble

      - name: Collect Artifacts
        # 与 release.yml 的 Prepare Release Assets 同一套 glob：只做"可下载呈现"，
        # 不改产物命名与调用约定。agent jar 缺失必须硬失败（那是唯一真入口）。
        run: |
          mkdir -p dist
          VERSION="$(grep -E '^remoldVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          echo "remold version: $VERSION"

          test -s core/build/libs/remold-agent.jar \
            || { echo "::error::core/build/libs/remold-agent.jar missing"; exit 1; }
          cp core/build/libs/remold-agent.jar dist/remold-agent.jar
          cp core/build/libs/remold-agent.jar "dist/remold-agent-${VERSION}.jar"

          for p in arc mixin forge fabric; do
            SRC=$(ls plugin-$p/build/libs/remold-plugin-$p-*.jar 2>/dev/null | grep -v 'sources' | sort -V | tail -n 1)
            if [ -n "$SRC" ] && [ -f "$SRC" ]; then
              cp "$SRC" "dist/remold-plugin-$p.jar"
            else
              echo "::warning::plugin-$p jar not found; skipped"
            fi
          done

          SRC_GRADLE=$(ls gradle-plugin/build/libs/remold-gradle-plugin-*.jar 2>/dev/null | grep -vE 'sources|javadoc' | sort -V | tail -n 1)
          if [ -n "$SRC_GRADLE" ] && [ -f "$SRC_GRADLE" ]; then
            cp "$SRC_GRADLE" dist/remold-gradle-plugin.jar
          else
            echo "::warning::gradle-plugin jar not found; skipped"
          fi

          SRC_API=$(ls api/build/libs/remold-api-*.jar 2>/dev/null | grep -v 'sources' | sort -V | tail -n 1)
          if [ -n "$SRC_API" ] && [ -f "$SRC_API" ]; then
            cp "$SRC_API" dist/remold-api.jar
          else
            echo "::warning::api jar not found; skipped"
          fi

          ( cd dist && sha256sum *.jar > SHA256SUMS.txt )
          ls -lh dist/

      - name: Present Artifacts in Job Summary
        # 运行页直接可读：文件名 / 体积 / 校验和前缀，完整哈希见 SHA256SUMS.txt。
        run: |
          VERSION="$(grep -E '^remoldVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          {
            echo "### Build artifacts (remold ${VERSION})"
            echo
            echo "Download from the **Artifacts** section of this run (\`remold-dist\`)."
            echo
            echo "| Artifact | Size | SHA-256 |"
            echo "|:--|--:|:--|"
            for f in dist/*.jar; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -d' ' -f1 | cut -c1-12)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: remold-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

