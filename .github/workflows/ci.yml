name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GRADLE_OPTS: --enable-native-access=ALL-UNNAMED

jobs:
  test:
    name: Test Matrix (javac 8/11/17/21/25)
    # 测试也会加载 core/libs 下的原生库（tests/build.gradle detectNativeLib）；
    # 与 build-native 同步，保证"测的库"就是"打包进发布物的库"。
    needs: build-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download Native Libraries
        uses: actions/download-artifact@v7
        with:
          name: native-libraries
          path: core/libs

      - name: Set up toolchain JDKs (8/11/17/21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            11
            17
            21

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Test Suites
        run: |
          chmod +x gradlew
          export JAVA_HOME="$JAVA_HOME_25_X64"
          echo "runner JAVA_HOME=$JAVA_HOME"
          java -version
          # fullCheck = check（JUnit + 文本扫描）+ e2eProbe（独立 JVM / Agent / Kotlin 差分）。
          # 本地日常只跑 check，提交前与 CI 跑全量，避免丢掉探针覆盖。
          ./gradlew fullCheck \
            -Dorg.gradle.jvmargs="-Xmx2g --enable-native-access=ALL-UNNAMED" \
            -Dhstest.requireJdks=true \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/build/test-results
            **/build/reports
          if-no-files-found: ignore

  test-dcevm:
    name: Test on DCEVM (JBR 21)
    needs: build-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Download Native Libraries
        uses: actions/download-artifact@v7
        with:
          name: native-libraries
          path: core/libs

      - name: Set up toolchain JDKs (8/11/17)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            11
            17

      - name: Set up JetBrains Runtime 21 (DCEVM)
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Live DCEVM Tests
        run: |
          chmod +x gradlew
          export JAVA_HOME="$JAVA_HOME_25_X64"
          echo "runner JAVA_HOME=$JAVA_HOME"
          echo "JBR 21 JAVA_HOME=$JAVA_HOME_21_X64"
          ./gradlew :tests:liveDcevmTest :tests:vcsPackProbe :tests:vcsTwoPhaseProbe \
            -Dorg.gradle.jvmargs="-Xmx2g --enable-native-access=ALL-UNNAMED" \
            -Dhstest.requireJdks=true \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false

  p05-probe:
    name: P0.5 Probe (JBR ${{ matrix.jbr }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        jbr: [ '17', '21' ]
    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchain JDKs (8/11/17/21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            11
            17
            21

      - name: Set up JetBrains Runtime ${{ matrix.jbr }} (DCEVM)
        id: jbr
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: ${{ matrix.jbr }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 堆遍历规模测量需要 Linux x64 的 JVMTI 底座
      - name: Build native libtool (Linux x64)
        run: |
          export JAVA_HOME="$JAVA_HOME_25_X64"
          bash scripts/build-native.sh linux-x64

      - name: Run P0.5 probe
        run: |
          chmod +x gradlew
          export JAVA_HOME="$JAVA_HOME_25_X64"
          echo "runner JAVA_HOME=$JAVA_HOME"
          echo "probe JAVA_HOME=${{ steps.jbr.outputs.path }}"
          ./gradlew :tests:p05Probe -Pp05.jbr="${{ steps.jbr.outputs.path }}" \
            -Dorg.gradle.jvmargs="-Xmx2g --enable-native-access=ALL-UNNAMED" \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false

      - name: Run two-phase probe
        run: |
          export JAVA_HOME="$JAVA_HOME_25_X64"
          ./gradlew :tests:twoPhaseProbe -Pp05.jbr="${{ steps.jbr.outputs.path }}" \
            -Dorg.gradle.jvmargs="-Xmx2g --enable-native-access=ALL-UNNAMED" \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false

  build-native:
    name: Build Native Libraries (Linux, Android, macOS & Windows)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Snapshot checked-in native libraries
        run: |
          rm -rf /tmp/checked-in-libs
          cp -r core/libs /tmp/checked-in-libs

      - name: Build all native libraries
        run: |
          export JAVA_HOME="$JAVA_HOME_25_X64"
          bash scripts/build-native.sh

      - name: Verify native ABIs, exports and repo sync
        run: bash scripts/verify-native.sh --compare /tmp/checked-in-libs core/libs

      # always()：即使上面的 ABI/仓内同步校验失败也要把刚编出来的产物带走。
      # C++ 改动必须有人把新产物回灌进仓库（verify-native 的 --compare 就是门），
      # 而 Android 产物只能由本 job（x86_64 + NDK）编出来，失败时拿不到产物就断了回灌链路。
      - name: Upload Native Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-libraries
          path: |
            core/libs/*.so
            core/libs/*.dylib
            core/libs/*.dll
          if-no-files-found: error

  build-jars:
    name: Build Distributable Jars
    # 必须等 build-native：jar 里打包的是 core/libs 下的原生库，若并行执行，
    # 打包的会是仓库里上次提交的旧二进制，CI 产物验证不到本分支的 tool.cpp 改动。
    needs: build-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download Native Libraries
        uses: actions/download-artifact@v7
        with:
          name: native-libraries
          path: core/libs

      - name: Verify Native Libraries
        run: |
          ls -la core/libs/
          bash scripts/verify-native.sh

      - name: Build Distributions and Jars
        # 与 release.yml 的发版构建同一条命令：CI 产物与发版资产同源，
        # 避免"CI 上能跑的 jar 不是最终发的那个"。
        run: |
          chmod +x gradlew
          export JAVA_HOME="$JAVA_HOME_25_X64"
          ./gradlew assemble \
            -Dorg.gradle.jvmargs="-Xmx2g --enable-native-access=ALL-UNNAMED"

      - name: Collect Artifacts
        # 与 release.yml 的 Prepare Release Assets 同一套 glob：只做"可下载呈现"，
        # 不改产物命名与调用约定。agent jar 缺失必须硬失败（那是唯一真入口）。
        run: |
          mkdir -p dist
          VERSION="$(grep -E '^remoldVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          echo "remold version: $VERSION"

          test -s core/build/libs/remold-agent.jar \
            || { echo "::error::core/build/libs/remold-agent.jar missing"; exit 1; }
          cp core/build/libs/remold-agent.jar dist/remold-agent.jar
          cp core/build/libs/remold-agent.jar "dist/remold-agent-${VERSION}.jar"

          for p in arc mixin forge fabric; do
            SRC=$(ls plugin-$p/build/libs/remold-plugin-$p-*.jar 2>/dev/null | grep -v 'sources' | sort -V | tail -n 1)
            if [ -n "$SRC" ] && [ -f "$SRC" ]; then
              cp "$SRC" "dist/remold-plugin-$p.jar"
            else
              echo "::warning::plugin-$p jar not found; skipped"
            fi
          done

          SRC_GRADLE=$(ls gradle-plugin/build/libs/remold-gradle-plugin-*.jar 2>/dev/null | grep -vE 'sources|javadoc' | sort -V | tail -n 1)
          if [ -n "$SRC_GRADLE" ] && [ -f "$SRC_GRADLE" ]; then
            cp "$SRC_GRADLE" dist/remold-gradle-plugin.jar
          else
            echo "::warning::gradle-plugin jar not found; skipped"
          fi

          SRC_API=$(ls api/build/libs/remold-api-*.jar 2>/dev/null | grep -v 'sources' | sort -V | tail -n 1)
          if [ -n "$SRC_API" ] && [ -f "$SRC_API" ]; then
            cp "$SRC_API" dist/remold-api.jar
          else
            echo "::warning::api jar not found; skipped"
          fi

          ( cd dist && sha256sum *.jar > SHA256SUMS.txt )
          ls -lh dist/

      - name: Present Artifacts in Job Summary
        # 运行页直接可读：文件名 / 体积 / 校验和前缀，完整哈希见 SHA256SUMS.txt。
        run: |
          VERSION="$(grep -E '^remoldVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          {
            echo "### Build artifacts (remold ${VERSION})"
            echo
            echo "Download from the **Artifacts** section of this run (\`remold-dist\`)."
            echo
            echo "| Artifact | Size | SHA-256 |"
            echo "|:--|--:|:--|"
            for f in dist/*.jar; do
              echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) | \`$(sha256sum "$f" | cut -d' ' -f1 | cut -c1-12)\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: remold-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  verify-macos:
    name: Verify Native Libraries (macOS arm64 & Rosetta x64)
    needs: build-native
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download Native Libraries
        uses: actions/download-artifact@v7
        with:
          name: native-libraries
          path: core/libs

      - name: Inspect Mach-O & codesign on macOS
        run: |
          file core/libs/libtoolarm64.dylib core/libs/libtool64.dylib
          otool -L core/libs/libtoolarm64.dylib
          otool -L core/libs/libtool64.dylib
          nm -gU core/libs/libtoolarm64.dylib
          nm -gU core/libs/libtool64.dylib
          codesign -dv --verbose=2 core/libs/libtoolarm64.dylib 2>&1 || true
          codesign --verify --strict core/libs/libtoolarm64.dylib

      - name: Ensure Rosetta 2 is available
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/uname -m

      - name: Set up JDKs (arm64 21/25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          architecture: arm64
          java-version: |
            21
            25

      - name: Set up JDKs (x64 21/25 for Rosetta)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          architecture: x64
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify native library on macOS arm64
        run: |
          chmod +x gradlew
          test -n "${JAVA_HOME_25_AARCH64:-}" && test -n "${JAVA_HOME_21_AARCH64:-}"
          export JAVA_HOME="$JAVA_HOME_25_AARCH64"
          export PATH="$JAVA_HOME/bin:$PATH"
          ./gradlew :tests:test --no-daemon \
            --tests "remold.LibToolTest" \
            --tests "remold.EnumBucketPlanTest" \
            -Dhstest.requireJdks=false \
            -Dhstest.expectedOsArch=aarch64 \
            -Dhstest.requireNativeBucketPlan=true \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_AARCH64,JAVA_HOME_25_AARCH64 \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false
          python3 scripts/verify-native-junit.py

      - name: Verify native library on macOS x64 (Rosetta)
        run: |
          test -n "${JAVA_HOME_25_X64:-}" && test -n "${JAVA_HOME_21_X64:-}"
          arch -x86_64 env \
            JAVA_HOME="$JAVA_HOME_25_X64" \
            PATH="$JAVA_HOME_25_X64/bin:$PATH" \
            ./gradlew :tests:test --no-daemon --rerun-tasks \
              --tests "remold.LibToolTest" \
              --tests "remold.EnumBucketPlanTest" \
              -Dhstest.requireJdks=false \
              -Dhstest.expectedOsArch=x86_64 \
              -Dhstest.requireNativeBucketPlan=true \
              -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
              -Dorg.gradle.java.installations.auto-detect=false \
              -Dorg.gradle.java.installations.auto-download=false
          python3 scripts/verify-native-junit.py

  verify-windows:
    name: Verify Native Library (Windows x64)
    needs: build-native
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download Native Libraries
        uses: actions/download-artifact@v7
        with:
          name: native-libraries
          path: core/libs

      - name: Set up JDKs (21/25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify native library on Windows x64
        shell: pwsh
        run: |
          $env:JAVA_HOME = $env:JAVA_HOME_25_X64
          $env:PATH = "$env:JAVA_HOME\bin;$env:PATH"
          .\gradlew.bat :tests:test --no-daemon `
            --tests "remold.LibToolTest" `
            --tests "remold.EnumBucketPlanTest" `
            "-Dhstest.requireJdks=false" `
            "-Dhstest.expectedOsArch=amd64" `
            "-Dhstest.requireNativeBucketPlan=true" `
            "-Dorg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64" `
            "-Dorg.gradle.java.installations.auto-detect=false" `
            "-Dorg.gradle.java.installations.auto-download=false"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/verify-native-junit.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

