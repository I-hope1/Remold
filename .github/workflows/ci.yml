name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test Matrix (javac 8/11/17/21/25)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up toolchain JDKs (8/11/17/21)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            11
            17
            21

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Test Suites
        run: |
          chmod +x gradlew
          export JAVA_HOME="$JAVA_HOME_25_X64"
          echo "runner JAVA_HOME=$JAVA_HOME"
          java -version
          ./gradlew check \
            -Dhstest.requireJdks=true \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            **/build/test-results
            **/build/reports
          if-no-files-found: ignore

  test-dcevm:
    name: Test on DCEVM (JBR 21)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up toolchain JDKs (8/11/17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            8
            11
            17

      - name: Set up JetBrains Runtime 21 (DCEVM)
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Live DCEVM Tests
        run: |
          chmod +x gradlew
          export JAVA_HOME="$JAVA_HOME_25_X64"
          echo "runner JAVA_HOME=$JAVA_HOME"
          echo "JBR 21 JAVA_HOME=$JAVA_HOME_21_X64"
          ./gradlew :tests:liveDcevmTest \
            -Dhstest.requireJdks=true \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false
