name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.2.0, default: current ref)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test Matrix (javac 8/11/17/21/25)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchain JDKs (8/11/17/21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            11
            17
            21

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Test Suites
        run: |
          chmod +x gradlew
          export JAVA_HOME="$JAVA_HOME_25_X64"
          echo "runner JAVA_HOME=$JAVA_HOME"
          java -version
          ./gradlew fullCheck \
            -Dhstest.requireJdks=true \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false

  test-dcevm:
    name: Test on DCEVM (JBR 21)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchain JDKs (8/11/17)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            11
            17

      - name: Set up JetBrains Runtime 21 (DCEVM)
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Live DCEVM Tests
        run: |
          chmod +x gradlew
          export JAVA_HOME="$JAVA_HOME_25_X64"
          echo "runner JAVA_HOME=$JAVA_HOME"
          echo "JBR 21 JAVA_HOME=$JAVA_HOME_21_X64"
          ./gradlew :tests:liveDcevmTest \
            -Dhstest.requireJdks=true \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false

  p05-probe:
    name: P0.5 Probe (JBR ${{ matrix.jbr }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        jbr: [ '17', '21' ]
    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchain JDKs (8/11/17/21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            11
            17
            21

      - name: Set up JetBrains Runtime ${{ matrix.jbr }} (DCEVM)
        id: jbr
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: ${{ matrix.jbr }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build native libtool (Linux x64)
        run: |
          mkdir -p core/libs
          g++ -shared -fPIC -std=c++2b -O3 \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            core/cpp/tool.cpp -o core/libs/libtool64.so

      - name: Run P0.5 probe
        run: |
          chmod +x gradlew
          export JAVA_HOME="$JAVA_HOME_25_X64"
          echo "runner JAVA_HOME=$JAVA_HOME"
          echo "probe JAVA_HOME=${{ steps.jbr.outputs.path }}"
          ./gradlew :tests:p05Probe -Pp05.jbr="${{ steps.jbr.outputs.path }}" \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false

      - name: Run two-phase probe
        run: |
          export JAVA_HOME="$JAVA_HOME_25_X64"
          ./gradlew :tests:twoPhaseProbe -Pp05.jbr="${{ steps.jbr.outputs.path }}" \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false

  build-native:
    name: Build Native Libraries (Linux x64 & Android arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Compile Linux x86_64 (.so)
        run: |
          mkdir -p core/libs
          g++ -shared -fPIC -std=c++2b -O3 \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            core/cpp/tool.cpp -o core/libs/libtool64.so
          ls -la core/libs/libtool64.so

      - name: Compile Android arm64-v8a (.so)
        run: |
          if [ -z "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            export ANDROID_NDK_HOME=$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          fi
          echo "Using Android NDK: $ANDROID_NDK_HOME"
          
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++ \
            -shared -fPIC -static-libstdc++ -std=c++2b -O3 \
            -Icore/cpp/jni_posix \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            core/cpp/tool.cpp -o core/libs/libtoolarm64.so
          ls -la core/libs/libtoolarm64.so

      - name: Verify native ABIs
        # Linux aarch64 产物与 Windows/macOS 产物一样随仓库分发（core/cpp/compile.bat 用 zig
        # aarch64-linux-gnu.2.17 生成），CI 只校验、不重建：zig c++ 的链接阶段会从源码构建它
        # 内置的 libc++，该内部构建不受 -w 控制，会在第三方头文件里刷出数千条
        # -Wnullability-completeness 注解——那正是把 aarch64 构建搬进 CI 后引入的噪声。
        # 校验项：glibc 构建（libc.so.6 + libpthread.so.0）、aarch64 glibc 基线 2.17、不是 bionic。
        run: |
          test -s core/libs/libtoolaarch64.so
          test -s core/libs/libtoolarm64.so
          readelf -h core/libs/libtoolaarch64.so | grep -F 'AArch64'
          readelf -d core/libs/libtoolaarch64.so | grep -F 'libc.so.6'
          readelf -d core/libs/libtoolaarch64.so | grep -F 'libpthread.so.0'
          readelf -d core/libs/libtoolarm64.so | grep -F '[libc.so]'
          ! readelf -V core/libs/libtoolaarch64.so | grep -E 'GLIBC_2\.(1[89]|[2-9][0-9])'

      - name: Upload Native Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: native-libraries
          path: |
            core/libs/*.so
          if-no-files-found: error

  publish:
    name: Build and Publish Release
    needs: [test, test-dcevm, p05-probe, build-native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download Native Libraries
        uses: actions/download-artifact@v7
        with:
          name: native-libraries
          path: core/libs

      - name: Verify Native Libraries
        # 缺任何一份都会让对应平台在运行期回落到 UnsatisfiedLinkError，必须在发版前硬失败。
        run: |
          ls -la core/libs/
          test -s core/libs/libtool64.so
          test -s core/libs/libtoolaarch64.so
          test -s core/libs/libtoolarm64.so
          readelf -d core/libs/libtoolaarch64.so | grep -F 'libc.so.6'
          readelf -d core/libs/libtoolarm64.so | grep -F '[libc.so]'

      - name: Build Distributions and Jars
        run: |
          chmod +x gradlew
          export JAVA_HOME="$JAVA_HOME_25_X64"
          ./gradlew assemble

      - name: Prepare Release Assets
        id: prepare
        run: |
          mkdir -p release-assets
          
          # Determine tag and version
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preparing assets for Tag: $TAG (Version: $VERSION)"
          
          # 1. Agent Jar (both canonical and versioned)
          cp core/build/libs/remold-agent.jar release-assets/remold-agent.jar
          cp core/build/libs/remold-agent.jar "release-assets/remold-agent-${VERSION}.jar"
          
          # 2. Plugin Jars (both canonical and versioned)
          for p in arc mixin forge fabric; do
            SRC=$(ls plugin-$p/build/libs/remold-plugin-$p-*.jar 2>/dev/null | grep -v 'sources' | head -n 1)
            if [ -n "$SRC" ] && [ -f "$SRC" ]; then
              cp "$SRC" release-assets/
              cp "$SRC" "release-assets/remold-plugin-$p.jar"
            fi
          done
          
          # 3. Gradle Plugin Jar
          SRC_GRADLE=$(ls "gradle-plugin/build/libs/remold-gradle-plugin-${VERSION}.jar" 2>/dev/null | head -n 1)
          if [ -z "$SRC_GRADLE" ]; then
            SRC_GRADLE=$(ls gradle-plugin/build/libs/remold-gradle-plugin-*.jar 2>/dev/null | grep -vE 'sources|javadoc' | head -n 1)
          fi
          if [ -n "$SRC_GRADLE" ] && [ -f "$SRC_GRADLE" ]; then
            cp "$SRC_GRADLE" release-assets/
            cp "$SRC_GRADLE" "release-assets/remold-gradle-plugin.jar"
          fi

          # 4. API Jar (useful for manual download / IDE attachment)
          SRC_API=$(ls api/build/libs/remold-api-*.jar 2>/dev/null | grep -v 'sources' | head -n 1)
          if [ -n "$SRC_API" ] && [ -f "$SRC_API" ]; then
            cp "$SRC_API" release-assets/
          fi
          
          # 5. Mod & Fabric Templates
          cp build/distributions/mindustry-mod-template.zip release-assets/
          cp build/distributions/minecraft-fabric-template.zip release-assets/
          
          # 6. Standalone Native Libraries
          cp core/libs/libtool64.so release-assets/
          cp core/libs/libtoolaarch64.so release-assets/
          cp core/libs/libtoolarm64.so release-assets/
          
          echo "Release assets ready:"
          ls -lh release-assets/

      - name: Publish Gradle plugin to the Plugin Portal
        # 幂等：Portal 上已有该版本就跳过（重复 publish 会被 Portal 以 409 拒绝，不该让发版变红）。
        # 需要仓库 secret：GRADLE_PUBLISH_KEY / GRADLE_PUBLISH_SECRET（Portal 个人凭据）。
        # 未配置 secret 时本步自动跳过，发版仍按 JitPack + GitHub Release 资产进行。
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          if [ -z "$GRADLE_PUBLISH_KEY" ] || [ -z "$GRADLE_PUBLISH_SECRET" ]; then
            echo "::notice::GRADLE_PUBLISH_KEY/SECRET not configured; skipping Plugin Portal publish"
            exit 0
          fi
          export JAVA_HOME="$JAVA_HOME_25_X64"
          VERSION="$(grep -E '^remoldVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          URL="https://plugins.gradle.org/m2/io/github/i-hope1/remold/gradle-plugin/${VERSION}/gradle-plugin-${VERSION}.jar"
          if curl -fsSL -o /dev/null "$URL"; then
            echo "::notice::gradle-plugin ${VERSION} is already on the Plugin Portal; skipping"
            exit 0
          fi
          ./gradlew :gradle-plugin:publishPlugins             -Pgradle.publish.key="$GRADLE_PUBLISH_KEY"             -Pgradle.publish.secret="$GRADLE_PUBLISH_SECRET"

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.prepare.outputs.tag }}"
          echo "Publishing to Release tag: $TAG"

          # Prefer a checked-in English release-notes file; fall back to generated notes.
          # (gh --generate-notes only lists PRs/commits and produced an empty body for v0.2.2/v0.2.3.)
          NOTES_FILE="docs/releases/${TAG}.md"
          NOTES_ARGS=()
          if [ -f "$NOTES_FILE" ]; then
            echo "Using release notes file: $NOTES_FILE"
            NOTES_ARGS=(--notes-file "$NOTES_FILE")
          else
            echo "No $NOTES_FILE; falling back to --generate-notes"
            NOTES_ARGS=(--generate-notes)
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading/overwriting assets..."
            gh release upload "$TAG" release-assets/* --clobber
            if [ -f "$NOTES_FILE" ]; then
              gh release edit "$TAG" --notes-file "$NOTES_FILE"
            fi
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release-assets/* --title "Remold $TAG" "${NOTES_ARGS[@]}"
          fi
