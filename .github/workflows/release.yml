name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.2.0, default: current ref)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Test Matrix (javac 8/11/17/21/25)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchain JDKs (8/11/17/21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            11
            17
            21

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Test Suites
        run: |
          chmod +x gradlew
          export JAVA_HOME="$JAVA_HOME_25_X64"
          echo "runner JAVA_HOME=$JAVA_HOME"
          java -version
          ./gradlew fullCheck \
            -Dhstest.requireJdks=true \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false

  test-dcevm:
    name: Test on DCEVM (JBR 21)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchain JDKs (8/11/17)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            11
            17

      - name: Set up JetBrains Runtime 21 (DCEVM)
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Live DCEVM Tests
        run: |
          chmod +x gradlew
          export JAVA_HOME="$JAVA_HOME_25_X64"
          echo "runner JAVA_HOME=$JAVA_HOME"
          echo "JBR 21 JAVA_HOME=$JAVA_HOME_21_X64"
          ./gradlew :tests:liveDcevmTest \
            -Dhstest.requireJdks=true \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false

  p05-probe:
    name: P0.5 Probe (JBR ${{ matrix.jbr }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        jbr: [ '17', '21' ]
    steps:
      - uses: actions/checkout@v7

      - name: Set up toolchain JDKs (8/11/17/21)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            8
            11
            17
            21

      - name: Set up JetBrains Runtime ${{ matrix.jbr }} (DCEVM)
        id: jbr
        uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: ${{ matrix.jbr }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build native libtool (Linux x64)
        run: |
          mkdir -p core/libs
          g++ -shared -fPIC -std=c++2b -O3 \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            core/cpp/tool.cpp -o core/libs/libtool64.so

      - name: Run P0.5 probe
        run: |
          chmod +x gradlew
          export JAVA_HOME="$JAVA_HOME_25_X64"
          echo "runner JAVA_HOME=$JAVA_HOME"
          echo "probe JAVA_HOME=${{ steps.jbr.outputs.path }}"
          ./gradlew :tests:p05Probe -Pp05.jbr="${{ steps.jbr.outputs.path }}" \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false

      - name: Run two-phase probe
        run: |
          export JAVA_HOME="$JAVA_HOME_25_X64"
          ./gradlew :tests:twoPhaseProbe -Pp05.jbr="${{ steps.jbr.outputs.path }}" \
            -Dorg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64,JAVA_HOME_11_X64,JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            -Dorg.gradle.java.installations.auto-detect=false \
            -Dorg.gradle.java.installations.auto-download=false

  build-native:
    name: Build Native Libraries (Linux x64 & Android arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Compile Linux x86_64 (.so)
        run: |
          mkdir -p core/libs
          g++ -shared -fPIC -std=c++2b -O3 \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            core/cpp/tool.cpp -o core/libs/libtool64.so
          ls -la core/libs/libtool64.so

      - name: Compile Android arm64-v8a (.so)
        run: |
          if [ -z "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            export ANDROID_NDK_HOME=$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          fi
          echo "Using Android NDK: $ANDROID_NDK_HOME"
          
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++ \
            -shared -fPIC -static-libstdc++ -std=c++2b -O3 \
            -Icore/cpp/jni_posix \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            core/cpp/tool.cpp -o core/libs/libtoolarm64.so
          ls -la core/libs/libtoolarm64.so

      - name: Upload Native Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: native-libraries
          path: |
            core/libs/*.so
          if-no-files-found: error

  publish:
    name: Build and Publish Release
    needs: [test, test-dcevm, p05-probe, build-native]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up runner JDK (25)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Download Native Libraries
        uses: actions/download-artifact@v7
        with:
          name: native-libraries
          path: core/libs

      - name: Verify Native Libraries
        run: |
          ls -la core/libs/

      - name: Build Distributions and Jars
        run: |
          chmod +x gradlew
          export JAVA_HOME="$JAVA_HOME_25_X64"
          ./gradlew assemble

      - name: Prepare Release Assets
        id: prepare
        run: |
          mkdir -p release-assets
          
          # Determine tag and version
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Preparing assets for Tag: $TAG (Version: $VERSION)"
          
          # 1. Agent Jar (both canonical and versioned)
          cp core/build/libs/remold-agent.jar release-assets/remold-agent.jar
          cp core/build/libs/remold-agent.jar "release-assets/remold-agent-${VERSION}.jar"
          
          # 2. Plugin Jars (both canonical and versioned)
          for p in arc mixin forge; do
            SRC=$(ls plugin-$p/build/libs/remold-plugin-$p-*.jar 2>/dev/null | grep -v 'sources' | head -n 1)
            if [ -n "$SRC" ] && [ -f "$SRC" ]; then
              cp "$SRC" release-assets/
              cp "$SRC" "release-assets/remold-plugin-$p.jar"
            fi
          done
          
          # 3. Gradle Plugin Jar
          SRC_GRADLE=$(ls gradle-plugin/build/libs/remold-gradle-plugin-*.jar 2>/dev/null | grep -v 'sources' | head -n 1)
          if [ -n "$SRC_GRADLE" ] && [ -f "$SRC_GRADLE" ]; then
            cp "$SRC_GRADLE" release-assets/
            cp "$SRC_GRADLE" "release-assets/remold-gradle-plugin.jar"
          fi

          # 4. API Jar (useful for manual download / IDE attachment)
          SRC_API=$(ls api/build/libs/remold-api-*.jar 2>/dev/null | grep -v 'sources' | head -n 1)
          if [ -n "$SRC_API" ] && [ -f "$SRC_API" ]; then
            cp "$SRC_API" release-assets/
          fi
          
          # 5. Mod & Fabric Templates
          cp build/distributions/mindustry-mod-template.zip release-assets/
          cp build/distributions/minecraft-fabric-template.zip release-assets/
          
          # 6. Standalone Native Libraries
          cp core/libs/libtool64.so release-assets/
          cp core/libs/libtoolarm64.so release-assets/
          
          echo "Release assets ready:"
          ls -lh release-assets/

      - name: Create or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.prepare.outputs.tag }}"
          echo "Publishing to Release tag: $TAG"
          
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, uploading/overwriting assets..."
            gh release upload "$TAG" release-assets/* --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" \
              release-assets/* \
              --title "Remold $TAG" \
              --generate-notes
          fi
