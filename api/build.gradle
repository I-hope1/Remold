plugins {
	id 'java-library'
	id 'maven-publish'
}

java {
	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets.main.java.srcDirs = ["src"]

publishing {
	publications {
		maven(MavenPublication) {
			from components.java
			pom {
				name = 'remold-api'
				description = 'API specifications and annotations for Remold'
				licenses {
					license {
						name = 'The Apache License, Version 2.0'
						url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
					}
				}
			}
		}
		// 本地联调兼容：将 JitPack 约定的 GitHub 坐标 (com.github.I-hope1.Remold:api:v<ver>) 同步发布到 mavenLocal，
		// 使得下游模板（如 Fabric / Mindustry 模板）在本地测试未发布的新版本时无需等待远程 JitPack 打 tag 即可直连命中。
		jitpack(MavenPublication) {
			groupId = 'com.github.I-hope1.Remold'
			artifactId = 'api'
			version = "v${version}"
			from components.java
			pom {
				name = 'remold-api'
				description = 'API specifications and annotations for Remold (JitPack compatible)'
				licenses {
					license {
						name = 'The Apache License, Version 2.0'
						url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
					}
				}
			}
		}
	}
}

dependencies {
	// 纯 API 模块，0 外部依赖
}

test {
	useJUnitPlatform()
	failOnNoDiscoveredTests = false
}
