plugins {
	id 'base'
}

allprojects {
	group = 'io.github.i-hope1.remold'
	version = '0.1.0'
	ext {
		mindustryVersion = 'v160.5'
	}
}

def jdkExports = [
	"java.base/jdk.internal.misc",
	"java.base/jdk.internal.reflect",
	"java.base/jdk.internal.loader",
	"java.base/jdk.internal.math",
	"java.base/jdk.internal.module",
	"java.base/jdk.internal.org.objectweb.asm",
	"java.base/jdk.internal.org.objectweb.asm.tree",
	"java.base/jdk.internal.org.objectweb.asm.util",
	"jdk.compiler/com.sun.tools.javac.api",
	"jdk.compiler/com.sun.tools.javac.file",
	"jdk.compiler/com.sun.tools.javac.util",
	"jdk.compiler/com.sun.tools.javac.tree",
	"jdk.compiler/com.sun.tools.javac.main",
	"jdk.attach/sun.tools.attach",
]

subprojects {
	apply plugin: 'base'
	base {
		archivesName = "remold-${project.name}"
	}
	plugins.withType(JavaPlugin).configureEach {
		dependencies {
			annotationProcessor files("${rootDir}/_libs/compiler.jar")
		}
	}
	tasks.withType(JavaCompile).configureEach {
		sourceCompatibility = JavaVersion.VERSION_21
		targetCompatibility = JavaVersion.VERSION_21
		options.encoding = 'UTF-8'
		options.compilerArgs += ["-AtargetVersion=11"]
		options.compilerArgs.addAll(jdkExports.collectMany { ["--add-exports", "${it}=ALL-UNNAMED"] })
	}
}
