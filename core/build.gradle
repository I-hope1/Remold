plugins {
	id 'java-library'
	id 'maven-publish'
	id 'com.gradleup.shadow'
}

sourceSets.main.java.srcDirs = ["src"]

publishing {
	publications {
		maven(MavenPublication) {
			artifact(shadowJar) {
				classifier = null
			}
			artifact(jar)
			artifact(sourcesJar)
			pom {
				name = 'remold-core'
				description = 'Core engine for Remold (InitFix, Anonymous Class Alignment, Native JVMTI)'
				licenses {
					license {
						name = 'The Apache License, Version 2.0'
						url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
					}
				}
			}
		}
	}
}
dependencies {
	api project(':api')

	// asm
	def asmVersion = '9.11'
	api "org.ow2.asm:asm:$asmVersion"
	api "org.ow2.asm:asm-commons:$asmVersion"
	api "org.ow2.asm:asm-analysis:$asmVersion"
	api "org.ow2.asm:asm-util:$asmVersion"
	api "org.ow2.asm:asm-tree:$asmVersion"
}

shadowJar {
	archiveFileName.set('remold-agent.jar')
	manifest {
		attributes(
				'Agent-Class': 'remold.RemoldAgent',
				'Premain-Class': 'remold.RemoldAgent',
				'Can-Retransform-Classes': true,
				'Can-Redefine-Classes': true
		)
	}
	from('libs') {
		into('libs')
	}
	exclude "module-info.class"
	relocate 'org.objectweb.asm', 'remold.internal.asm'
}

jar {
	dependsOn shadowJar
	archiveClassifier.set('raw')
	from('libs') {
		into('libs')
	}
}


test {
	useJUnitPlatform()
	// 本模块没有 JUnit 测试（测试入口是 scratch/hstest 下的 JUnit 套件，由 hstestJunit 跑）。
	// 不设这一条时，`:test` 会因"有测试源但没发现测试"而失败 —— 那是既有问题，
	// 与本次改动无关，但会让 `check` 永远红。
	failOnNoDiscoveredTests = false
}

tasks.register('compileNativeArm64') {
	group = 'build'
	description = 'Compiles core/cpp/tool.cpp into core/libs/libtoolarm64.so using Android NDK'
	doLast {
		def ndkDir = System.getenv('ANDROID_NDK_HOME') ?: System.getenv('ANDROID_NDK_ROOT')
		if (!ndkDir && System.getenv('ANDROID_HOME')) {
			def ndkRoot = new File(System.getenv('ANDROID_HOME'), 'ndk')
			if (ndkRoot.exists()) {
				def ndkList = ndkRoot.listFiles().findAll { it.isDirectory() }.sort { it.name }
				if (ndkList) ndkDir = ndkList.last().absolutePath
			}
		}
		if (!ndkDir) {
			logger.warn('[Remold] 未找到 ANDROID_NDK_HOME，无法编译 Android arm64 原生库。')
			return
		}
		def isWin = System.getProperty('os.name').toLowerCase().contains('win')
		def llvmBin = new File(ndkDir, "toolchains/llvm/prebuilt/${isWin ? 'windows-x86_64' : 'linux-x86_64'}/bin")
		def compilerName = isWin ? 'aarch64-linux-android30-clang++.cmd' : 'aarch64-linux-android30-clang++'
		def compiler = new File(llvmBin, compilerName)
		if (!compiler.exists()) {
			throw new GradleException("[Remold] 未在 NDK 中找到编译器: ${compiler.absolutePath}")
		}
		def javaHome = System.getenv('JAVA_HOME') ?: System.getProperty('java.home')
		def outLib = file('libs/libtoolarm64.so')
		outLib.parentFile.mkdirs()

		List<String> cmd = []
		if (isWin) {
			cmd.add('cmd.exe')
			cmd.add('/c')
		}
		cmd.add(compiler.absolutePath)
		cmd.add('-shared')
		cmd.add('-fPIC')
		cmd.add('-static-libstdc++')
		cmd.add('-std=c++2b')
		cmd.add('-O3')
		cmd.add("-I${file('cpp/jni_posix').absolutePath}".toString())
		cmd.add("-I${new File(javaHome, 'include').absolutePath}".toString())
		cmd.add(file('cpp/tool.cpp').absolutePath)
		cmd.add('-o')
		cmd.add(outLib.absolutePath)

		def pb = new ProcessBuilder(cmd).redirectErrorStream(true)
		def process = pb.start()
		def output = process.inputStream.text
		def exitCode = process.waitFor()
		if (exitCode != 0) {
			logger.error(output)
			throw new GradleException("[Remold] 编译 libtoolarm64.so 失败 (code ${exitCode}):\n${output}")
		}
		logger.lifecycle("[Remold] Android arm64 原生库编译完成: ${outLib.absolutePath}")
	}
}
