plugins {
    id 'application'
}

application {
    mainClass = 'example.Main'
}

dependencies {
    // 编译期注解支持（如 @RemoldReinit, @OnReload）；外部独立工程可直接使用: compileOnly "com.github.I-hope1.Remold:api:v0.2.5"
    compileOnly project(':api')
}

// remold.gradle 只是薄壳：实现全在 :gradle-plugin。仓库内优先用刚构建出的本地插件 jar（离线可用）。
// 干净检出（CI / 首次 clone）时本地 jar 还不存在；为保持构建的离线确定性，这里不主动解析 JitPack
// 坐标（即使对应版本已发布），而是“没有本地 jar 就跳过 remold 集成”，example 仍可正常编译。
def remoldPluginJar = rootProject.file("gradle-plugin/build/libs/remold-gradle-plugin-${rootProject.findProperty('remoldVersion') ?: '0.2.5'}.jar")
def configuredPluginJar = findProperty('remold.pluginJar')
if (configuredPluginJar == null && remoldPluginJar.isFile()) {
    ext.set('remold.pluginJar', remoldPluginJar.absolutePath)
    configuredPluginJar = remoldPluginJar.absolutePath
}
if (configuredPluginJar != null) {
    apply from: rootProject.file('remold.gradle')

    remold {
        // 模式一（当前激活）：标准应用模式，自动使用 application.mainClass ('example.Main')
        // 内部工程构建依赖：启动前确保 agent 被编译就绪（外部使用者无需配置此项，插件会自动下载 Release agent）
        dependsOn ':core:shadowJar'

        // 模式二（模组/游戏推荐）：纯净 JAR 启动模式（例如 Mindustry 模组开发）
        // 彻底解决类加载器双重加载冲突，无需配置 mainClass（自动从 jar 的 MANIFEST.MF 读取）
        // jar = "libs/Mindustry.jar"
        // args = ["-loadmods"]
        // dependsOn 'jar' // 启动前自动执行打包当前模组
    }
} else {
    logger.lifecycle("[example] Local Remold Gradle plugin jar not found; skipping remold integration."
        + " Run ':gradle-plugin:jar' or pass -Premold.pluginJar=<jar> to enable it.")
}
