plugins {
	id 'java-gradle-plugin'
	id 'maven-publish'
	id 'com.gradle.plugin-publish' version '1.3.1'
}

sourceSets {
	main.java.srcDirs = ["src"]
	test.java.srcDirs = ["test"]
}

dependencies {
	testImplementation gradleTestKit()
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

// 仓库根的 remold.gradle / remold.gradle.kts 是薄壳（只负责把本插件挂到工程上），随 jar 附带一份，
// 方便离线/内网用户直接取出使用。实现只有一份：就在本模块里，脚本里没有任何构建逻辑。
processResources {
	from(rootProject.file('remold.gradle')) { into 'remold' }
	from(rootProject.file('remold.gradle.kts')) { into 'remold' }
	from(rootProject.file('LICENSE')) { into 'META-INF' }
}

javadoc {
	options.encoding = 'UTF-8'
	options.addStringOption('Xdoclint:none', '-quiet')
}

gradlePlugin {
	website = 'https://github.com/I-hope1/Remold'
	vcsUrl = 'https://github.com/I-hope1/Remold.git'
	plugins {
		remold {
			// 插件 id 与 build.gradle 里的 group（io.github.i-hope1.remold）保持同源；
			// 实现类的包名去掉了连字符（Java 标识符不允许 '-'），两者不必逐字相同。
			id = 'io.github.i-hope1.remold'
			implementationClass = 'io.github.ihope1.remold.gradle.RemoldPlugin'
			displayName = 'Remold Hot Reload'
			description = 'Hot-reload Gradle plugin for Remold: assembles -javaagent/DCEVM arguments, registers runRemold and the IDEA run configuration.'
			tags.set(['hotswap', 'hot-reload', 'dcevm', 'agent', 'jvm'])
		}
	}
}

// 统一 artifactId，避免消费者拿到 remold-gradle-plugin 与 gradle-plugin 两种写法
publishing {
	publications {
		jitpack(MavenPublication) {
			from components.java
			groupId = 'com.github.I-hope1.Remold'
			artifactId = 'gradle-plugin'
			pom {
				name = 'remold-gradle-plugin'
				description = 'Gradle plugin for Remold hot reload (JitPack publication)'
				licenses {
					license {
						name = 'The Apache License, Version 2.0'
						url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
					}
				}
			}
		}
	}
	publications.withType(MavenPublication).configureEach {
		if (name == 'pluginMaven') {
			artifactId = 'gradle-plugin'
			pom {
				name = 'remold-gradle-plugin'
				description = 'Gradle plugin for Remold hot reload'
				licenses {
					license {
						name = 'The Apache License, Version 2.0'
						url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
					}
				}
			}
		}
	}
}

test {
	useJUnitPlatform()
	failOnNoDiscoveredTests = false
	// The script-shim test boots a nested build that must resolve the plugin from a real jar
	// (apply-from scripts cannot see the test classpath). Hand it the freshly built artifact.
	dependsOn tasks.named('jar')
	// archiveFile can only be queried once the jar task is ready, so resolve it right before the fork.
	doFirst {
		systemProperty 'remold.pluginJar', tasks.named('jar').get().archiveFile.get().asFile.absolutePath
	}
	systemProperty 'remold.shimGroovy', rootProject.file('remold.gradle').absolutePath
	systemProperty 'remold.shimKts', rootProject.file('remold.gradle.kts').absolutePath
}
