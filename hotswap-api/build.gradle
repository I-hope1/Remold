plugins {
	id 'java-library'
	id 'maven-publish'
}

sourceSets.main.java.srcDirs = ["src"]

publishing {
	publications {
		maven(MavenPublication) {
			from components.java
			pom {
				name = 'nipx-hotswap-api'
				description = 'API specifications and annotations for nipx-hotswap'
				licenses {
					license {
						name = 'The Apache License, Version 2.0'
						url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
					}
				}
			}
		}
	}
}

dependencies {
	// 纯 API 模块，0 外部依赖
}

test {
	useJUnitPlatform()
	failOnNoDiscoveredTests = false
}
