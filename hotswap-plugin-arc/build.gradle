plugins {
	id 'java-library'
	id 'maven-publish'
}

sourceSets.main.java.srcDirs = ["src"]

publishing {
	publications {
		maven(MavenPublication) {
			from components.java
			pom {
				name = 'nipx-hotswap-plugin-arc'
				description = 'Mindustry/Arc integration plugin for nipx-hotswap'
				licenses {
					license {
						name = 'GNU General Public License v3.0'
						url = 'https://www.gnu.org/licenses/gpl-3.0.txt'
					}
				}
			}
		}
	}
}

dependencies {
	compileOnly project(':hotswap-api')
	compileOnly project(':hotswap-core')
	compileOnly project(':jni-agent')
	compileOnly "Anuken:Mindustry:$mindustryVersion"

	// ASM for bytecode analysis in Injector / CellPropertyRef
	def asmVersion = '9.9.1'
	compileOnly "org.ow2.asm:asm:$asmVersion"
	compileOnly "org.ow2.asm:asm-commons:$asmVersion"
	compileOnly "org.ow2.asm:asm-analysis:$asmVersion"
	compileOnly "org.ow2.asm:asm-util:$asmVersion"
	compileOnly "org.ow2.asm:asm-tree:$asmVersion"
}

test {
	useJUnitPlatform()
	failOnNoDiscoveredTests = false
}
