# ========================================
# Remold 热重载自动化配置
# ========================================

# Remold 版本号（脚本 / agent / api 三者同版本；远程引入脚本插件时按此 tag 拉取）
remold.version=0.1.3

# 1. 目标运行的 Mindustry.jar 路径（请按本地实际路径修改）
remold.jar=D:/Mindustry/Mindustry.jar

# 2. 开启自动部署：启动前自动打包并将 Desktop.jar 部署到系统 Mindustry mods 目录
# 模版默认跨平台自动识别系统 mods 路径（Win: %APPDATA%/Mindustry/mods 等）
remold.autoDeploy=true

# 3. 启用 Mindustry / Arc 框架扩展插件（UI 高频 Lambda 熔断保护、@HotRebuild 原位热重构、GL 渲染耗时探针）
remold.plugins=arc

# 可选：若使用的是自定义模组存放目录，请取消下行注释并填写：
# remold.deployDir=D:/Mindustry/mods
# (兼容别名: remold.modsDir=D:/Mindustry/mods)

# 可选：显式指定 agent jar（本地联调 Remold 本体时用，避免拿到旧发布包）
# remold.agentJar=../core/build/libs/remold-agent.jar
