# ========================================
# Remold 热重载自动化配置
# ========================================

# Remold 版本号
remold.version=0.1.1

# 1. 目标运行的 Mindustry.jar 路径（请按本地实际路径修改）
remold.jar=D:/Mindustry/Mindustry.jar

# 2. 开启自动部署：启动前自动打包并将 Desktop.jar 复制到系统 Mindustry mods 目录
remold.autoDeploy=true

# 可选：若使用的是自定义 mods 目录，请取消下行注释并填写：
# remold.modsDir=D:/Mindustry/mods
