// Remold Gradle 脚本插件（薄壳）
//
// 本文件不含任何构建逻辑：解析 JBR、解析/下载 agent 与插件 jar、拼装 JVM 参数、注册
// runRemold / deployArtifact / deployMod / generateIdeaRunConfig / generateRemoldScript /
// startRemold 等任务，全部在二进制插件 `io.github.i-hope1.remold`（`:gradle-plugin`）里实现。
// 这里只负责把那个插件挂到当前工程上，避免"脚本一份实现、插件另一份实现"的双份漂移。
//
// 插件来源（从高到低）：
//   1. -Premold.pluginJar=<本地插件 jar> 或环境变量 REMOLD_PLUGIN_JAR（离线 / 本地开发用）
//   2. JitPack 坐标 com.github.I-Hope1.Remold:gradle-plugin:v<version>，
//      version 取 -Premold.version / gradle.properties 的 remoldVersion，缺省用下面的内联版本
//
// 注意：务必用 tag 地址引入本脚本（.../v<version>/remold.gradle），不要用 main ——
// 内联默认版本与 agent/api 必须同版本，否则脚本按新接口拼参数、agent 还是旧版本，问题只会在运行期暴露。

buildscript {
	// 常量必须定义在 buildscript 闭包内：该闭包的 delegate 是 ScriptHandler 且为 DELEGATE_FIRST，
	// 引用脚本级 def 会直接抛 "unknown property" 而不会回退到 owner。
	def shimVersion = '0.2.5'
	def explicitJar = project.findProperty('remold.pluginJar') ?: System.getenv('REMOLD_PLUGIN_JAR')
	def version = project.findProperty('remold.version')
		?: project.findProperty('remoldVersion')
		?: shimVersion

	if (explicitJar != null) {
		dependencies {
			classpath files(explicitJar)
		}
	} else {
		repositories {
			maven { url = uri('https://jitpack.io') }
			mavenCentral()
			gradlePluginPortal()
		}
		dependencies {
			classpath "com.github.I-Hope1.Remold:gradle-plugin:v${version}"
		}
	}
}

// 必须按 Class 应用：字符串形式的 apply plugin: '<id>' 走插件注册表，而注册表在脚本编译期就已固定，
// 看不到本脚本在上面的 buildscript 块里新增的 classpath（实测会抛 Plugin not found）。
apply plugin: buildscript.classLoader.loadClass('io.github.ihope1.remold.gradle.RemoldPlugin')
