// Remold Gradle Script Plugin (Groovy DSL)
// Usage: apply from: 'https://raw.githubusercontent.com/I-hope1/Remold/v<version>/remold.gradle'
//        本地开发: apply from: rootProject.file('remold.gradle')
// 注意：远程引入务必用 **tag**（v0.2.0）而不是 main —— 脚本与 agent / api 必须同版本，
//       否则脚本按新接口拼参数、agent 还是旧版本，会在运行期才炸。

import org.gradle.api.plugins.JavaApplication
import org.gradle.api.tasks.compile.JavaCompile

class RemoldExtension {
    String version
    String agentJar
    String jbrPath
    boolean debug = false
    int debugPort = 5005
    String mainClass
    Object jar
    List<Object> args = []
    List<Object> watchDirs = []
    List<String> extraJvmArgs = []
    Integer fileShakeMs
    List<Object> dependsOn = []
    Object deployDir
    Object modsDir
    Boolean autoDeploy
    String buildMode
    List<Object> plugins = []
    /** 显式指定的插件 Jar（本地开发 Remold 插件时用，优先于自动解析/下载）。 */
    List<Object> pluginJars = []

    void plugins(Object... p) {
        if (p != null) {
            for (def item : p) {
                if (item instanceof Collection) this.plugins.addAll(item)
                else this.plugins.add(item)
            }
        }
    }

    void pluginJar(Object file) {
        if (file != null) this.pluginJars.add(file)
    }

    void jar(Object jar) {
        this.jar = jar
    }

    void args(Object... args) {
        if (args != null) {
            this.args.addAll(args as List)
        }
    }

    void dependsOn(Object... tasks) {
        if (tasks != null) {
            this.dependsOn.addAll(tasks as List)
        }
    }

    void deployDir(Object dir) {
        this.deployDir = dir
        this.autoDeploy = true
    }

    void modsDir(Object dir) {
        this.modsDir = dir
        this.autoDeploy = true
    }
}

def remoldExt = project.extensions.create('remold', RemoldExtension)
def cachedConfig = null

project.plugins.withId('java') {
    // 确保编译输出包含完整调试符号（行号、源码、局部变量表），供 InitFix 参数回溯、Lambda 对齐与调试使用
    tasks.withType(JavaCompile).configureEach {
        options.debug = true
        options.debugOptions.debugLevel = 'source,lines,vars'
    }

    def isWinOs = System.getProperty('os.name').toLowerCase().contains('win')
    def localRemoldDir = new File(project.rootDir, '.gradle/remold')

    /**
     * 由 JVM 家目录或 java 可执行文件反推出 IDE 认可的 **JRE 家目录**。
     * IDEA 的 ALTERNATIVE_JRE_PATH 只接受家目录（或已注册的 SDK 名）；写入 `...\bin\java.exe`
     * 会被判定为路径不存在并直接弹框拒绝启动。取不到时返回空串（此时不写该字段）。
     */
    def toJreHome = { String path ->
        if (!path) return ''
        def f = new File(path)
        if (f.isFile() || f.name.equalsIgnoreCase('java') || f.name.equalsIgnoreCase('java.exe')) {
            def bin = f.parentFile
            if (bin == null || !bin.name.equalsIgnoreCase('bin')) return ''
            f = bin.parentFile
            if (f == null) return ''
        }
        // JDK 8 的 java.home 通常是 <jdk>/jre，向上取一层才是 IDE 认可的 JDK 家目录
        if (f.name.equalsIgnoreCase('jre')) {
            def parent = f.parentFile
            if (parent != null && new File(parent, isWinOs ? 'bin/java.exe' : 'bin/java').exists()) f = parent
        }
        return f.isDirectory() ? f.absolutePath : ''
    }

    /** 解析运行用 JVM（可执行文件路径与 JRE 家目录）。 */
    def resolveJbr = {
        def execPath = new File(System.getProperty('java.home'), isWinOs ? 'bin/java.exe' : 'bin/java').absolutePath
        def execHome = toJreHome(System.getProperty('java.home'))
        if (!new File(execPath).exists()) {
            execPath = 'java'
            execHome = ''
        }
        def jbr = remoldExt.jbrPath ?: project.findProperty('remold.jbr') ?: project.findProperty('jbr.home') ?: System.getenv('JBR_HOME') ?: System.getProperty('jbr.home')
        if (jbr) {
            def jbrDir = new File(jbr.toString())
            def javaBin = jbrDir.isFile() ? jbrDir : new File(jbrDir, isWinOs ? 'bin/java.exe' : 'bin/java')
            if (javaBin.exists()) {
                execPath = javaBin.absolutePath
                execHome = toJreHome(javaBin.absolutePath)
            } else {
                logger.warn("[Remold] Specified JBR path does not exist: ${jbr}. Falling back to project SDK JVM.")
            }
        }
        return [execPath: execPath, execHome: execHome]
    }

    /** 解析部署目标目录。 */
    def resolveDeployDir = {
        def dir = remoldExt.deployDir ?: remoldExt.modsDir ?: project.findProperty('remold.deployDir') ?: project.findProperty('remold.modsDir') ?: project.findProperty('remoldDeployDir') ?: project.findProperty('remoldModsDir')
        return dir != null ? project.file(dir) : null
    }

    /** 是否属于基于散装类路径（Classpath-based）驱动的模组开发生态（如 Minecraft Fabric / Quilt / NeoForge / Forge）。 */
    def isClassBasedEnvironment = {
        def pluginIds = [
            'fabric-loom',
            'dev.architectury.loom',
            'org.quiltmc.loom',
            'net.neoforged.moddev',
            'net.neoforged.gradle.userdev',
            'net.minecraftforge.gradle',
            'gg.essential.multi-version'
        ]
        for (id in pluginIds) {
            if (project.plugins.hasPlugin(id)) return true
        }
        def extNames = ['loom', 'minecraft', 'neoForge']
        for (ext in extNames) {
            if (project.extensions.findByName(ext) != null) return true
        }
        if (project.tasks.findByName('runClient') != null) {
            if (project.tasks.findByName('remapJar') != null || project.tasks.findByName('jar') != null) {
                return true
            }
        }
        return false
    }

    /** 是否自动执行 deployArtifact。 */
    def shouldAutoDeploy = {
        if (isClassBasedEnvironment()) {
            boolean explicitAutoDeploy = remoldExt.autoDeploy != null ? remoldExt.autoDeploy : (project.findProperty('remold.autoDeploy') ? project.findProperty('remold.autoDeploy').toString().toBoolean() : false)
            if (explicitAutoDeploy) {
                project.logger.warn("[Remold] [WARN] 'autoDeploy = true' is ignored in Minecraft/Loom environment. In-dev runs use loose classes; outputting JARs to run/mods causes namespace crashes and bytecode rollbacks.")
            }
            return false
        }
        return remoldExt.autoDeploy != null ? remoldExt.autoDeploy : (project.findProperty('remold.autoDeploy') ? project.findProperty('remold.autoDeploy').toString().toBoolean() : (resolveDeployDir() != null))
    }

    def downloadRemoteJar = { String urlStr, File targetFile ->
        boolean ok = false
        String curUrl = urlStr
        for (int hop = 0; hop < 5; hop++) {
            try {
                def uri = java.net.URI.create(curUrl)
                def conn = uri.toURL().openConnection()
                if (!(conn instanceof HttpURLConnection)) break
                conn.connectTimeout = 10000
                conn.readTimeout = 30000
                conn.instanceFollowRedirects = true
                conn.setRequestProperty("User-Agent", "Remold-Gradle-Plugin")
                int code = conn.responseCode
                if (code in 300..399) {
                    String loc = conn.getHeaderField("Location")
                    if (!loc) break
                    curUrl = loc.startsWith("http") ? loc : uri.resolve(loc).toString()
                    continue
                }
                if (code == 200) {
                    conn.inputStream.withCloseable { inStream ->
                        targetFile.withOutputStream { outStream ->
                            outStream << inStream
                        }
                    }
                    if (targetFile.exists() && targetFile.length() > 1024) {
                        ok = true
                        break
                    } else {
                        targetFile.delete()
                    }
                }
                break
            } catch (Exception ignored) {
                targetFile.delete()
                break
            }
        }
        return ok
    }

    def syncIntoLocalRemold = { File src, File dest ->
        if (src == null || !src.exists()) return dest
        try {
            if (src.canonicalPath == dest.canonicalPath) return src
            if (dest.exists() && dest.length() == src.length() && dest.lastModified() == src.lastModified()) return dest
            dest.parentFile.mkdirs()
            java.nio.file.Files.copy(src.toPath(), dest.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            dest.setLastModified(src.lastModified())
            return dest
        } catch (Exception ignored) {
            return src
        }
    }

    /**
     * 统一的 Jar 本地查找、Gradle 缓存探测、detachedConfiguration 解析与远端 Releases 下载。
     */
    def resolveOrDownloadJar = { String artifactLabel, String ver, List<File> candidates, File cachedJar, List<String> mavenNotations, List<String> downloadUrls ->
        def found = candidates.find { it != null && it.exists() }
        if (found != null && found.exists()) {
            return found
        }
        if (cachedJar != null && cachedJar.exists() && cachedJar.length() > 1024) {
            return cachedJar
        }
        File resolvedJar = null
        if (ver) {
            for (String notation : mavenNotations) {
                try {
                    def detached = project.configurations.detachedConfiguration(
                        project.dependencies.create(notation)
                    )
                    detached.transitive = false
                    def resolved = detached.resolve()
                    if (!resolved.isEmpty()) {
                        resolvedJar = resolved.first()
                        break
                    }
                } catch (Exception ignored) { }
            }
        }
        if ((resolvedJar == null || !resolvedJar.exists()) && cachedJar != null && downloadUrls) {
            logger.lifecycle("[Remold] Downloading ${artifactLabel} (version: ${ver})...")
            cachedJar.parentFile?.mkdirs()
            for (String urlStr : downloadUrls) {
                if (downloadRemoteJar(urlStr, cachedJar)) {
                    resolvedJar = cachedJar
                    logger.lifecycle("[Remold] ${artifactLabel} ready: ${cachedJar.absolutePath}")
                    break
                }
            }
        }
        return resolvedJar
    }

    /**
     * 是否属于 SpongePowered Mixin 生态：Fabric Loom 项目，或显式声明了 net.fabricmc / org.spongepowered 依赖。
     * 命中即默认挂载 plugin-mixin（可用 -Premold.autoMixin=false 关闭）。
     */
    def usesMixinEcosystem = {
        if (project.plugins.hasPlugin('fabric-loom') || project.extensions.findByName('loom') != null) {
            return true
        }
        try {
            return project.configurations.any { cfg ->
                try {
                    return cfg.dependencies.any { dep ->
                        dep.group == 'org.spongepowered' || dep.group == 'net.fabricmc'
                    }
                } catch (Throwable ignored) {
                    return false
                }
            }
        } catch (Throwable ignored) {
            return false
        }
    }

    /**
     * 是否属于 Minecraft Forge / NeoForge 生态：声明了对应 Gradle 插件或依赖。
     * 命中即默认挂载 plugin-forge（可用 -Premold.autoForge=false 关闭）。
     */
    def usesForgeEcosystem = {
        if (project.plugins.hasPlugin('net.minecraftforge.gradle')
            || project.plugins.hasPlugin('net.neoforged.moddev')
            || project.plugins.hasPlugin('net.neoforged.gradle.userdev')
            || project.extensions.findByName('neoForge') != null
            || project.extensions.findByName('minecraft') != null
        ) {
            return true
        }
        try {
            return project.configurations.any { cfg ->
                try {
                    return cfg.dependencies.any { dep ->
                        dep.group == 'net.minecraftforge' || dep.group == 'net.neoforged' || (dep.group != null && dep.group.startsWith('net.neoforged'))
                    }
                } catch (Throwable ignored) {
                    return false
                }
            }
        } catch (Throwable ignored) {
            return false
        }
    }

    def resolveRemoldConfig = {
        if (cachedConfig != null) {
            return cachedConfig
        }

        // 0. 解析目标 jar (若配置了 jar，进入纯净 JAR 模式)
        def jarProp = remoldExt.jar ?: project.findProperty('remold.jar') ?: project.findProperty('remoldJar')
        File targetJar = null
        if (jarProp != null) {
            targetJar = project.file(jarProp)
            if (!targetJar.exists()) {
                logger.warn("[Remold] Notice: Target launch JAR does not exist yet: ${targetJar.absolutePath} (can be ignored if not running immediately)")
            }
        }

        // 1. 解析 mainClass
        def main = remoldExt.mainClass ?: project.findProperty('remold.mainClass') ?: project.findProperty('remoldMainClass') ?: (project.extensions.findByName('application') instanceof JavaApplication ? project.extensions.findByName('application').mainClass.orNull : null) ?: project.findProperty('mainClassName')

        if (main == null && targetJar != null && targetJar.exists()) {
            try {
                def jf = new java.util.jar.JarFile(targetJar)
                main = jf.manifest?.mainAttributes?.getValue('Main-Class')
                jf.close()
            } catch (Exception ignored) { }
        }

        if (main == null) {
            if (targetJar != null && targetJar.exists()) {
                throw new GradleException("[Remold] Could not read Main-Class from MANIFEST.MF of ${targetJar.name}. Please specify it explicitly via remold { mainClass = '...' }.")
            } else if (targetJar != null) {
                main = 'unknown.MainClass'
            } else if (project.plugins.hasPlugin('fabric-loom') || project.extensions.findByName('loom') != null) {
                main = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
            } else {
                throw new GradleException("[Remold] Neither mainClass nor jar is configured. Please specify via remold { mainClass = '...' }, remold { jar = '...' }, or gradle.properties.")
            }
        }

        // 2. 解析运行用 JVM
        def jvm = resolveJbr()
        def execPath = jvm.execPath
        def execHome = jvm.execHome

        // 3. 解析版本与 agent jar
        def ver = remoldExt.version ?: project.findProperty('remold.version') ?: project.findProperty('remoldVersion') ?: (project.rootProject.hasProperty('remoldVersion') ? project.rootProject.property('remoldVersion') : null)
        File agentFile = remoldExt.agentJar ? new File(remoldExt.agentJar.toString()) : null
        def agentCandidates = []
        if (agentFile != null) {
            agentCandidates.add(agentFile)
        }
        agentCandidates.addAll([
            project.file('libs/remold-agent.jar'),
            project.file('remold-agent.jar'),
            project.rootProject.file('core/build/libs/remold-agent.jar'),
            project.rootProject.file('../core/build/libs/remold-agent.jar'),
            new File(localRemoldDir, 'remold-agent.jar')
        ])

        def cachedAgentJar = ver ? new File(project.gradle.gradleUserHomeDir, "caches/remold/remold-agent-${ver}.jar") : null
        def agentNotations = ver ? ["com.github.I-hope1.Remold:core:${ver}", "com.github.I-hope1.Remold:core:${ver}:all"] : []
        def agentUrls = ver ? [
            "https://github.com/I-hope1/Remold/releases/download/v${ver}/remold-agent.jar",
            "https://github.com/I-hope1/Remold/releases/download/${ver}/remold-agent.jar"
        ] : []

        agentFile = resolveOrDownloadJar('remold-agent.jar', ver ? ver.toString() : null, agentCandidates, cachedAgentJar, agentNotations, agentUrls)

        if (agentFile == null || !agentFile.exists()) {
            throw new GradleException(
                "[Remold] remold-agent.jar was not found and could not be downloaded automatically (target version: ${ver})!\n" +
                "Please check your network connection or specify a valid version in remold { version = '...' },\n" +
                "or specify a local file explicitly in remold { agentJar = '/path/to/remold-agent.jar' }."
            )
        }

        agentFile = syncIntoLocalRemold(agentFile, new File(localRemoldDir, 'remold-agent.jar'))

        // 4. 自动推导编译输出与资源目录并拼装监听路径
        def rawBuildMode = remoldExt.buildMode ?: project.findProperty("remold.buildMode") ?: project.findProperty("remold.build_mode") ?: project.findProperty("remold.builder") ?: project.findProperty("remoldBuildMode")
        def buildMode = rawBuildMode ? rawBuildMode.toString() : null
        if (!buildMode || buildMode.trim().isEmpty() || "null" == buildMode) {
            def gradleXml = new File(project.rootDir, ".idea/gradle.xml")
            if (gradleXml.isFile() && gradleXml.getText('UTF-8').contains('name="delegatedBuild" value="false"')) {
                buildMode = "idea"
            } else {
                buildMode = "auto"
            }
        }
        def normalizedBuildMode = buildMode.toString().trim().toLowerCase()

        def classesDirs = sourceSets.main.output.classesDirs.files
        def resourceDirs = sourceSets.main.resources.srcDirs
        def assetsDir = new File(project.projectDir, "assets")
        def outResourceDir = sourceSets.main.output.resourcesDir
        def extraDirs = remoldExt.watchDirs.collect { project.file(it) }

        def allCandidateDirs = []
        if (normalizedBuildMode == "idea") {
            def ideaOutDir = new File(project.projectDir, "out/production")
            def subs = ideaOutDir.isDirectory() ? ideaOutDir.listFiles().findAll { it.isDirectory() } : null
            if (subs != null && !subs.isEmpty()) {
                allCandidateDirs.addAll(subs)
            } else {
                allCandidateDirs.add(ideaOutDir)
            }
        } else if (normalizedBuildMode == "auto") {
            allCandidateDirs.addAll(classesDirs)
            def ideaOutDir = new File(project.projectDir, "out/production")
            if (ideaOutDir.isDirectory()) {
                def subs = ideaOutDir.listFiles().findAll { it.isDirectory() }
                if (subs != null && !subs.isEmpty()) {
                    allCandidateDirs.addAll(subs)
                } else {
                    allCandidateDirs.add(ideaOutDir)
                }
            }
        } else {
            allCandidateDirs.addAll(classesDirs)
        }

        allCandidateDirs.addAll(resourceDirs)
        if (assetsDir != null) allCandidateDirs.add(assetsDir)
        if (outResourceDir != null) allCandidateDirs.add(outResourceDir)
        allCandidateDirs.addAll(extraDirs)
        def allWatchDirs = allCandidateDirs.findAll { it.exists() }.unique()
        def watchPath = allWatchDirs.collect { it.absolutePath }.join(File.pathSeparator)

        // 5. 装配 JVM 参数
        def args = [
            "-XX:+IgnoreUnrecognizedVMOptions",
            "-XX:+AllowEnhancedClassRedefinition",
            "-javaagent:${agentFile.absolutePath}=${watchPath}",
            "-Dremold.build_mode=${normalizedBuildMode}",
            "--add-exports=java.base/jdk.internal.misc=ALL-UNNAMED",
            "--add-exports=java.base/jdk.internal.reflect=ALL-UNNAMED",
            "--add-exports=java.base/jdk.internal.loader=ALL-UNNAMED",
            "--enable-native-access=ALL-UNNAMED"
        ]

        if (remoldExt.debug || "true".equalsIgnoreCase(System.getProperty("remold.debug"))) {
            def port = remoldExt.debugPort
            args << "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:${port}"
            logger.lifecycle("[Remold] JDWP debugging enabled, listening on localhost: 127.0.0.1:${port}")
        }

        if (remoldExt.extraJvmArgs) {
            args.addAll(remoldExt.extraJvmArgs)
        }
        if (remoldExt.fileShakeMs != null) {
            args << "-Dremold.agent.file_shake_ms=${remoldExt.fileShakeMs}"
        }

        // 6. 解析扩展插件配置 (如 arc / mixin)
        def requestedPlugins = []
        if (remoldExt.plugins) {
            requestedPlugins.addAll(remoldExt.plugins.collect { it.toString().trim() }.findAll { !it.isEmpty() })
        }
        def pluginProps = project.findProperty('remold.plugins') ?: project.findProperty('remoldPlugins')
        if (pluginProps) {
            requestedPlugins.addAll(pluginProps.toString().split('[,;]').collect { it.trim() }.findAll { !it.isEmpty() })
        }
        def autoMixin = project.findProperty('remold.autoMixin') == null ? true : project.findProperty('remold.autoMixin').toString().toBoolean()
        if (autoMixin && !requestedPlugins.any { it.toString().equalsIgnoreCase('mixin') } && usesMixinEcosystem()) {
            requestedPlugins.add('mixin')
        }
        def autoForge = project.findProperty('remold.autoForge') == null ? true : project.findProperty('remold.autoForge').toString().toBoolean()
        if (autoForge && !requestedPlugins.any { it.toString().equalsIgnoreCase('forge') || it.toString().equalsIgnoreCase('neoforge') } && usesForgeEcosystem()) {
            requestedPlugins.add('forge')
        }
        requestedPlugins = requestedPlugins.unique()

        def pluginJars = []
        remoldExt.pluginJars.each { explicit ->
            def f = project.file(explicit)
            if (f.exists()) {
                pluginJars.add(syncIntoLocalRemold(f, new File(localRemoldDir, "plugins/${f.name}")))
            } else {
                logger.warn("[Remold] Specified plugin jar does not exist: ${f.absolutePath}")
            }
        }
        if (requestedPlugins) {
            for (String pluginName : requestedPlugins) {
                def targetModule = pluginName.equalsIgnoreCase('neoforge') ? 'forge' : pluginName
                if (pluginJars.any { it.name.contains("remold-plugin-${targetModule}") || it.name.contains("plugin-${targetModule}") }) {
                    continue
                }
                def pluginJarCandidates = [
                    project.rootProject.file("plugin-${targetModule}/build/libs/remold-plugin-${targetModule}-${ver}.jar"),
                    project.rootProject.file("plugin-${targetModule}/build/libs/remold-plugin-${targetModule}.jar"),
                    project.rootProject.file("../plugin-${targetModule}/build/libs/remold-plugin-${targetModule}-${ver}.jar"),
                    project.rootProject.file("../plugin-${targetModule}/build/libs/remold-plugin-${targetModule}.jar"),
                    ver ? new File(project.gradle.gradleUserHomeDir, "caches/remold/remold-plugin-${targetModule}-${ver}.jar") : null
                ].findAll { it != null }
                try {
                    project.rootDir.parentFile?.listFiles()?.each { sibling ->
                        if (sibling.isDirectory) {
                            pluginJarCandidates.add(new File(sibling, "plugin-${targetModule}/build/libs/remold-plugin-${targetModule}-${ver}.jar"))
                            pluginJarCandidates.add(new File(sibling, "plugin-${targetModule}/build/libs/remold-plugin-${targetModule}.jar"))
                        }
                    }
                } catch (Throwable ignored) { }

                def cachedPluginJar = ver ? new File(project.gradle.gradleUserHomeDir, "caches/remold/remold-plugin-${targetModule}-${ver}.jar") : null
                def pluginNotations = ver ? ["com.github.I-hope1.Remold:plugin-${targetModule}:${ver}"] : []
                def pluginUrls = ver ? [
                    "https://github.com/I-hope1/Remold/releases/download/v${ver}/remold-plugin-${targetModule}-${ver}.jar",
                    "https://github.com/I-hope1/Remold/releases/download/v${ver}/remold-plugin-${targetModule}.jar",
                    "https://github.com/I-hope1/Remold/releases/download/${ver}/remold-plugin-${targetModule}-${ver}.jar",
                    "https://github.com/I-hope1/Remold/releases/download/${ver}/remold-plugin-${targetModule}.jar"
                ] : []

                def resolvedPluginJar = resolveOrDownloadJar("remold-plugin-${targetModule}.jar", ver ? ver.toString() : null, pluginJarCandidates, cachedPluginJar, pluginNotations, pluginUrls)

                if (resolvedPluginJar != null && resolvedPluginJar.exists()) {
                    pluginJars.add(syncIntoLocalRemold(resolvedPluginJar, new File(localRemoldDir, "plugins/${resolvedPluginJar.name}")))
                } else {
                    logger.warn("[Remold] Plugin remold-plugin-${targetModule} jar not found; can be ignored if embedded or not required.")
                }
            }

            args << "-Dremold.plugins=${requestedPlugins.join(',')}"
            if (!pluginJars.isEmpty()) {
                def pluginJarsPath = pluginJars.collect { it.absolutePath }.join(File.pathSeparator)
                args << "-Dremold.plugin.jars=${pluginJarsPath}"
            }
        }

        def runtimeClasspath = targetJar != null ? project.files(targetJar) : sourceSets.main.runtimeClasspath
        def appArgs = remoldExt.args.collect { it.toString() }

        cachedConfig = [
            mainClass: main,
            executable: execPath,
            executableHome: execHome,
            agentFile: agentFile,
            allWatchDirs: allWatchDirs,
            watchPath: watchPath,
            jvmArgs: args,
            appArgs: appArgs,
            runtimeClasspath: runtimeClasspath,
            targetJar: targetJar
        ]
        return cachedConfig
    }

    tasks.register('runRemold', JavaExec) {
        group = 'application'
        description = 'Runs the application with Remold Java Agent & JBR DCEVM (blocking foreground)'

        classpath = sourceSets.main.runtimeClasspath

        doFirst {
            def conf = resolveRemoldConfig()
            if (conf.targetJar != null && !conf.targetJar.exists()) {
                throw new GradleException("[Remold] Target launch JAR does not exist; cannot launch application: ${conf.targetJar.absolutePath}")
            }
            mainClass.set(conf.mainClass)
            classpath = conf.runtimeClasspath
            if (conf.appArgs) {
                args(conf.appArgs)
            }
            if (conf.executable != 'java') {
                executable = conf.executable
            }
            jvmArgs(conf.jvmArgs)

            logger.lifecycle("[Remold] Launch configuration assembled:")
            if (conf.targetJar != null) {
                logger.lifecycle("  - Target JAR: ${conf.targetJar.absolutePath}")
            }
            logger.lifecycle("  - Main class: ${conf.mainClass}")
            logger.lifecycle("  - Agent: ${conf.agentFile.absolutePath}")
            logger.lifecycle("  - Watch directories (${conf.allWatchDirs.size()}): ${conf.watchPath}")
            if (conf.appArgs) {
                logger.lifecycle("  - App arguments: ${conf.appArgs.join(' ')}")
            }
            if (remoldExt.fileShakeMs != null) {
                logger.lifecycle("  - File Shake: ${remoldExt.fileShakeMs}ms")
            }
            if (conf.executable != 'java') {
                logger.lifecycle("  - JBR: ${conf.executable}")
            }
        }
    }

    tasks.register('deployArtifact', Copy) {
        group = 'application'
        description = 'Builds and deploys the output JAR into the specified deploy directory'
        dependsOn { project.tasks.findByName('remapJar') ?: 'jar' }
        doFirst {
            resolveRemoldConfig()
        }
        from { project.tasks.findByName('remapJar') ?: tasks.named('jar') }
        into {
            def target = resolveDeployDir()
            if (target == null) {
                throw new GradleException('[Remold] autoDeploy is enabled but deploy directory is not configured! Please specify via remold { deployDir = "..." } or gradle.properties (remold.deployDir=...).')
            }
            return target
        }
        doLast {
            logger.lifecycle("[Remold] Artifact deployed to: ${resolveDeployDir().absolutePath}")
        }
    }

    tasks.register('deployMod') {
        group = 'application'
        description = 'Alias for deployArtifact'
        dependsOn 'deployArtifact'
    }

    tasks.named('classes') {
        doLast {
            try {
                def localAgent = new File(project.rootDir, ".gradle/remold/remold-agent.jar")
                if (!localAgent.exists() || localAgent.length() <= 1024) {
                    resolveRemoldConfig()
                }
            } catch (Exception ignored) { }
        }
    }

    def generateIdeaRunConfigInternal = {
        def conf = resolveRemoldConfig()
        def ideaRunDir = new File(project.rootDir, '.idea/runConfigurations')
        ideaRunDir.mkdirs()

        def xmlEscape = { String s ->
            if (s == null) return ''
            return s.replace('&', '&amp;')
                    .replace('"', '&quot;')
                    .replace('<', '&lt;')
                    .replace('>', '&gt;')
        }

        def makePortable = { String p ->
            if (p == null) return ''
            def rootPath = project.rootDir.absolutePath.replace('\\', '/')
            def norm = p.replace('\\', '/')
            def rootLower = rootPath.toLowerCase()
            while (true) {
                def normLower = norm.toLowerCase()
                def idx = normLower.indexOf(rootLower)
                if (idx == -1) break
                norm = norm.substring(0, idx) + '$PROJECT_DIR$' + norm.substring(idx + rootPath.length())
            }
            return norm
        }

        def portableJvmArgs = conf.jvmArgs.collect { makePortable(it) }.join(' ')
        def portableAppArgs = conf.appArgs.collect { makePortable(it) }.join(' ')
        def jrePath = (conf.executableHome ?: '').replace('\\', '/')
        def hasCustomJre = !jrePath.isEmpty()

        def xmlFile = new File(ideaRunDir, 'Run_with_Remold.xml')
        def xml = new StringBuilder()
        xml.append('<component name="ProjectRunConfigurationManager">\n')

        def isLoom = project.plugins.hasPlugin('fabric-loom') || project.extensions.findByName('loom') != null
        if (isLoom) {
            xml.append('  <configuration default="false" name="Run with Remold" type="GradleRunConfiguration" factoryName="Gradle">\n')
            xml.append('    <ExternalSystemSettings>\n')
            xml.append('      <option name="executionName" />\n')
            xml.append('      <option name="externalProjectPath" value="$PROJECT_DIR$" />\n')
            xml.append('      <option name="externalSystemIdString" value="GRADLE" />\n')
            xml.append('      <option name="scriptParameters" value="" />\n')
            xml.append('      <option name="taskDescriptions">\n')
            xml.append('        <list />\n')
            xml.append('      </option>\n')
            xml.append('      <option name="taskNames">\n')
            xml.append('        <list>\n')
            xml.append('          <option value="runClient" />\n')
            xml.append('        </list>\n')
            xml.append('      </option>\n')
            xml.append('      <option name="vmOptions" value="" />\n')
            xml.append('    </ExternalSystemSettings>\n')
            xml.append('    <ExternalSystemDebugServerProcess>true</ExternalSystemDebugServerProcess>\n')
            xml.append('    <ExternalSystemReAttachDebugProcess>true</ExternalSystemReAttachDebugProcess>\n')
            xml.append('    <DebugAllEnabled>false</DebugAllEnabled>\n')
            xml.append('    <RunAsTest>false</RunAsTest>\n')
            xml.append('    <method v="2" />\n')
            xml.append('  </configuration>\n')
        } else if (conf.targetJar != null) {
            def portableJar = makePortable(conf.targetJar.absolutePath)
            xml.append('  <configuration default="false" name="Run with Remold" type="JarApplication">\n')
            xml.append("    <option name=\"JAR_PATH\" value=\"${xmlEscape(portableJar)}\" />\n")
            xml.append("    <option name=\"VM_PARAMETERS\" value=\"${xmlEscape(portableJvmArgs)}\" />\n")
            if (portableAppArgs) {
                xml.append("    <option name=\"PROGRAM_PARAMETERS\" value=\"${xmlEscape(portableAppArgs)}\" />\n")
            }
            xml.append('    <option name=\"WORKING_DIRECTORY\" value=\"$PROJECT_DIR$\" />\n')
            if (hasCustomJre) {
                xml.append("    <option name=\"ALTERNATIVE_JRE_PATH\" value=\"${xmlEscape(jrePath)}\" />\n")
                xml.append('    <option name=\"ALTERNATIVE_JRE_PATH_ENABLED\" value=\"true\" />\n')
            }
            xml.append('    <method v=\"2\">\n')
            if (shouldAutoDeploy()) {
                xml.append('      <option name=\"Gradle.BeforeRunTask\" enabled=\"true\" tasks=\"deployArtifact\" externalProjectPath=\"$PROJECT_DIR$\" />\n')
            } else {
                xml.append('      <option name=\"Gradle.BeforeRunTask\" enabled=\"true\" tasks=\"classes\" externalProjectPath=\"$PROJECT_DIR$\" />\n')
            }
            xml.append('    </method>\n')
            xml.append('  </configuration>\n')
        } else {
            def moduleName = "${project.name}.main"
            xml.append('  <configuration default="false" name="Run with Remold" type="Application" factoryName="Application">\n')
            xml.append("    <option name=\"MAIN_CLASS_NAME\" value=\"${xmlEscape(conf.mainClass)}\" />\n")
            xml.append("    <module name=\"${xmlEscape(moduleName)}\" />\n")
            xml.append("    <option name=\"VM_PARAMETERS\" value=\"${xmlEscape(portableJvmArgs)}\" />\n")
            if (portableAppArgs) {
                xml.append("    <option name=\"PROGRAM_PARAMETERS\" value=\"${xmlEscape(portableAppArgs)}\" />\n")
            }
            xml.append('    <option name=\"WORKING_DIRECTORY\" value=\"$PROJECT_DIR$\" />\n')
            if (hasCustomJre) {
                xml.append("    <option name=\"ALTERNATIVE_JRE_PATH\" value=\"${xmlEscape(jrePath)}\" />\n")
                xml.append('    <option name=\"ALTERNATIVE_JRE_PATH_ENABLED\" value=\"true\" />\n')
            }
            xml.append('    <method v=\"2\">\n')
            xml.append('      <option name=\"Make\" enabled=\"true\" />\n')
            xml.append('    </method>\n')
            xml.append('  </configuration>\n')
        }
        xml.append('</component>\n')

        xmlFile.write(xml.toString(), 'UTF-8')

        // 自动适配 Fabric Loom：若存在 Loom 生成的 Minecraft_Client.xml / Minecraft_Server.xml，自动同步 Remold 插件、探针参数与运行前 deployArtifact
        try {
            def loomRunConfigs = ['Minecraft_Client.xml', 'Minecraft_Server.xml']
            for (String configName : loomRunConfigs) {
                def clientXml = new File(ideaRunDir, configName)
                if (!clientXml.exists()) continue

                def content = clientXml.getText('UTF-8')
                def modified = false

                // 1. 同步 VM_PARAMETERS
                def regex = ~/<option name="VM_PARAMETERS" value="([^"]*)"\s*\/>/
                def matcher = regex.matcher(content)
                if (matcher.find()) {
                    def existing = matcher.group(1)
                    def updated = existing
                    def agentRegex = ~/(?:^|\s)-javaagent:[^\s=]+remold-agent\.jar[^\s]*/
                    for (String arg : conf.jvmArgs) {
                        def portableArg = makePortable(arg)
                        if (arg.startsWith('-javaagent:') && arg.contains('remold-agent.jar')) {
                            if (agentRegex.matcher(updated).find()) {
                                updated = agentRegex.matcher(updated).replaceAll(java.util.regex.Matcher.quoteReplacement(" ${portableArg}")).trim()
                            } else if (!updated.contains(portableArg)) {
                                updated = updated.trim() ? "${updated} ${portableArg}" : portableArg
                            }
                        } else if (arg.startsWith("-Dremold.plugin.jars=")) {
                            def p = ~/(?:^|\s)-Dremold\.plugin\.jars=[^\s]*/
                            updated = p.matcher(updated).replaceAll("").trim()
                            updated = updated.trim() ? "${updated} ${portableArg}" : portableArg
                        } else if (arg.startsWith("-Dremold.plugins=")) {
                            def p = ~/(?:^|\s)-Dremold\.plugins=[^\s]*/
                            updated = p.matcher(updated).replaceAll("").trim()
                            updated = updated.trim() ? "${updated} ${portableArg}" : portableArg
                        } else if (arg.startsWith("-Dremold.build_mode=")) {
                            def p = ~/(?:^|\s)-Dremold\.build_mode=[^\s]*/
                            updated = p.matcher(updated).replaceAll("").trim()
                            updated = updated.trim() ? "${updated} ${portableArg}" : portableArg
                        } else if (!updated.contains(portableArg) && !updated.contains(arg)) {
                            updated = updated.trim() ? "${updated} ${portableArg}" : portableArg
                        }
                    }
                    if (updated != existing) {
                        content = content.replace(matcher.group(0), "<option name=\"VM_PARAMETERS\" value=\"${xmlEscape(updated)}\"/>")
                        modified = true
                    }
                }

                def expectedBeforeRunBlock = '    <method v="2">\n      <option name="Make" enabled="true" />\n    </method>'
                def methodRegex = ~/(?s)<method v="2">.*?<\/method>|<method v="2"\s*\/>/

                if (content.contains('tasks="deployArtifact"') || content.contains('tasks=":classes"') || content.contains('tasks="classes"') || !content.contains('<option name="Make" enabled="true" />')) {
                    if (methodRegex.matcher(content).find()) {
                        content = methodRegex.matcher(content).replaceFirst(java.util.regex.Matcher.quoteReplacement(expectedBeforeRunBlock))
                        modified = true
                    }
                }

                if (modified) {
                    clientXml.write(content, 'UTF-8')
                    logger.lifecycle("[Remold] Automatically synchronized Remold parameters into ${configName}")
                }
            }
        } catch (Throwable ignored) { }

        return xmlFile
    }

    project.afterEvaluate {
        def autoDeploy = shouldAutoDeploy()

        def jvm = resolveJbr()
        if (jvm.execPath != 'java') {
            tasks.named('runRemold', JavaExec) {
                javaLauncher.set((JavaLauncher) null)
            }
        }

        ['runRemold', 'startRemold', 'generateRemoldScript', 'generateIdeaRunConfig'].each { name ->
            tasks.named(name) {
                if (autoDeploy) dependsOn 'deployArtifact'
                if (remoldExt.dependsOn) dependsOn remoldExt.dependsOn
            }
        }
        if (autoDeploy) {
            tasks.findByName('runClient')?.dependsOn('deployArtifact')
        }

        def ideaDir = new File(project.rootDir, '.idea')
        def xmlFile = new File(project.rootDir, '.idea/runConfigurations/Run_with_Remold.xml')
        if (ideaDir.exists()) {
            tasks.findByName('classes')?.finalizedBy('generateIdeaRunConfig')
            if (!xmlFile.exists()) {
                try {
                    def out = generateIdeaRunConfigInternal()
                    if (out != null) {
                        logger.lifecycle("[Remold] IntelliJ IDEA run configuration ready: ${out.absolutePath}")
                    }
                } catch (Throwable ignored) {
                }
            }
        }

        // 自动适配 Fabric Loom 项目：注入 runClient 运行配置
        if (project.plugins.hasPlugin('fabric-loom') || project.extensions.findByName('loom') != null) {
            try {
                def loom = project.extensions.findByName('loom')
                if (loom != null) {
                    def runs = loom.getRuns()
                    def client = runs?.findByName('client')
                    if (client != null) {
                        def conf = resolveRemoldConfig()
                        for (arg in conf.jvmArgs) {
                            client.vmArg(arg)
                        }
                        logger.lifecycle("[Remold] Injected hot-reload agent parameters into Fabric Loom runClient!")
                    }
                }
            } catch (Throwable ignored) {
            }
        }

        // 自动适配 NeoForge ModDevGradle 项目：注入 client 运行配置
        try {
            def runsExt = project.extensions.findByName('runs') ?: project.extensions.findByName('neoForge')?.extensions?.findByName('runs')
            if (runsExt != null) {
                def clientRun = runsExt.findByName('client')
                if (clientRun != null) {
                    def conf = resolveRemoldConfig()
                    try {
                        clientRun.jvmArguments.addAll(conf.jvmArgs)
                        logger.lifecycle("[Remold] Injected hot-reload agent parameters into NeoForge ModDevGradle runClient!")
                    } catch (Throwable ignored) {
                        for (arg in conf.jvmArgs) {
                            clientRun.jvmArg(arg)
                        }
                        logger.lifecycle("[Remold] Injected hot-reload agent parameters into NeoForge runClient!")
                    }
                }
            }
        } catch (Throwable ignored) { }

        // 自动适配 ForgeGradle 项目：注入 minecraft.runs.client 运行配置
        try {
            def mcExt = project.extensions.findByName('minecraft')
            if (mcExt != null) {
                def runs = mcExt.getRuns()
                def client = runs?.findByName('client')
                if (client != null) {
                    def conf = resolveRemoldConfig()
                    for (arg in conf.jvmArgs) {
                        client.jvmArg(arg)
                    }
                    logger.lifecycle("[Remold] Injected hot-reload agent parameters into ForgeGradle runClient!")
                }
            }
        } catch (Throwable ignored) { }
    }

    tasks.register('generateIdeaRunConfig') {
        group = 'application'
        description = 'Generates IntelliJ IDEA run configuration into .idea/runConfigurations/Run_with_Remold.xml'
        dependsOn 'classes'

        doLast {
            def xmlFile = generateIdeaRunConfigInternal()
            if (xmlFile != null) {
                logger.lifecycle("[Remold] Generated IntelliJ IDEA run configuration: ${xmlFile.absolutePath}")
                logger.lifecycle("[Remold] Open this project in IDEA to launch directly with the run/debug configuration.")
            }
        }
    }

    tasks.register('generateRemoldScript') {
        group = 'application'
        description = 'Generates native standalone launcher scripts and args file to run Remold without Gradle Daemon'
        dependsOn 'classes', 'generateIdeaRunConfig'

        doLast {
            def conf = resolveRemoldConfig()
            if (conf.targetJar != null && !conf.targetJar.exists()) {
                throw new GradleException("[Remold] Target launch JAR does not exist; cannot launch application: ${conf.targetJar.absolutePath}")
            }
            def buildDir = project.layout.buildDirectory.asFile.get()
            def remoldDir = new File(buildDir, 'remold')
            remoldDir.mkdirs()

            def argsFile = new File(remoldDir, 'remold.args')
            def lines = []
            lines.addAll(conf.jvmArgs)
            lines.add('-cp')
            lines.add(conf.runtimeClasspath.asPath)
            lines.add(conf.mainClass)
            if (conf.appArgs) {
                lines.addAll(conf.appArgs)
            }

            argsFile.withWriter('UTF-8') { writer ->
                lines.each { line ->
                    if (line.contains(' ') || line.contains('\t')) {
                        writer.write("\"${line.replace('\\', '\\\\')}\"\n")
                    } else {
                        writer.write("${line}\n")
                    }
                }
            }

            def batFile = new File(buildDir, 'run-remold.bat')
            batFile.write("@echo off\r\nset \"JAVA_EXE=${conf.executable}\"\r\nif not exist \"%JAVA_EXE%\" set \"JAVA_EXE=java\"\r\n\"%JAVA_EXE%\" @\"%~dp0remold\\remold.args\" %*\r\n", 'UTF-8')

            def shFile = new File(buildDir, 'run-remold.sh')
            shFile.write("#!/usr/bin/env bash\nDIR=\"\$(cd \"\$(dirname \"\${BASH_SOURCE[0]}\")\" && pwd)\"\nJAVA_EXE=\"${conf.executable}\"\nif [ ! -f \"\$JAVA_EXE\" ]; then\n    JAVA_EXE=\"java\"\nfi\nexec \"\$JAVA_EXE\" \"@\$DIR/remold/remold.args\" \"\$@\"\n", 'UTF-8')
            try {
                shFile.setExecutable(true, false)
            } catch (Exception ignored) { }

            logger.lifecycle("[Remold] Generated native launch script:")
            logger.lifecycle("  - Windows: ${batFile.absolutePath}")
            logger.lifecycle("  - Linux/macOS: ${shFile.absolutePath}")
            logger.lifecycle("  - Args file: ${argsFile.absolutePath}")
            logger.lifecycle("[Remold] Run the script directly to launch the application without Gradle daemon overhead.")
        }
    }

    tasks.register('startRemold') {
        group = 'application'
        description = 'Starts the application in a detached process so Gradle Daemon is immediately freed'
        dependsOn 'generateRemoldScript'

        doLast {
            def conf = resolveRemoldConfig()
            if (conf.targetJar != null && !conf.targetJar.exists()) {
                throw new GradleException("[Remold] Target launch JAR does not exist; cannot launch application: ${conf.targetJar.absolutePath}")
            }
            def buildDir = project.layout.buildDirectory.asFile.get()
            def argsFile = new File(buildDir, 'remold/remold.args')

            if (isWinOs) {
                new ProcessBuilder('cmd', '/c', 'start', "\"Remold [${project.name}]\"", conf.executable, "@${argsFile.absolutePath}")
                    .directory(project.projectDir)
                    .start()
                logger.lifecycle("[Remold] Application launched in a separate console window.")
            } else {
                def logFile = new File(buildDir, 'remold/remold.log')
                new ProcessBuilder(conf.executable, "@${argsFile.absolutePath}")
                    .directory(project.projectDir)
                    .redirectOutput(logFile)
                    .redirectErrorStream(true)
                    .start()
                logger.lifecycle("[Remold] Application launched in background. Output log: ${logFile.absolutePath}")
            }
            logger.lifecycle("[Remold] Gradle Daemon released (IDLE). Run ./gradlew compileJava in terminal anytime to trigger hot-reload.")
        }
    }
}
