// Remold Gradle Script Plugin (Groovy DSL)
// Usage: apply from: 'https://raw.githubusercontent.com/I-hope1/Remold/v<version>/remold.gradle'
//        本地开发: apply from: rootProject.file('remold.gradle')
// 注意：远程引入务必用 **tag**（v0.1.3）而不是 main —— 脚本与 agent / api 必须同版本，
//       否则脚本按新接口拼参数、agent 还是旧版本，会在运行期才炸。

import org.gradle.api.plugins.JavaApplication

class RemoldExtension {
    String version
    String agentJar
    String jbrPath
    boolean debug = false
    int debugPort = 5005
    String mainClass
    Object jar
    List<Object> args = []
    List<Object> watchDirs = []
    List<String> extraJvmArgs = []
    Integer fileShakeMs
    List<Object> dependsOn = []
    Object deployDir
    Object modsDir
    Boolean autoDeploy
    List<Object> plugins = []
    /** 显式指定的插件 Jar（本地开发 Remold 插件时用，优先于自动解析/下载）。 */
    List<Object> pluginJars = []

    void plugins(Object... p) {
        if (p != null) {
            for (def item : p) {
                if (item instanceof Collection) this.plugins.addAll(item)
                else this.plugins.add(item)
            }
        }
    }

    void pluginJar(Object file) {
        if (file != null) this.pluginJars.add(file)
    }

    void jar(Object jar) {
        this.jar = jar
    }

    void args(Object... args) {
        if (args != null) {
            this.args.addAll(args as List)
        }
    }

    void dependsOn(Object... tasks) {
        if (tasks != null) {
            this.dependsOn.addAll(tasks as List)
        }
    }

    void deployDir(Object dir) {
        this.deployDir = dir
        this.autoDeploy = true
    }

    void modsDir(Object dir) {
        this.modsDir = dir
        this.autoDeploy = true
    }
}

def remoldExt = project.extensions.create('remold', RemoldExtension)

project.plugins.withId('java') {
    def sourceSets = project.extensions.getByType(SourceSetContainer)

    // 是否属于 SpongePowered Mixin 生态：Fabric Loom 项目，或显式声明了 net.fabricmc / org.spongepowered 依赖。
    // 命中即默认挂载 plugin-mixin（可用 -Premold.autoMixin=false 关闭）。
    def usesMixinEcosystem = {
        if (project.plugins.hasPlugin('fabric-loom') || project.extensions.findByName('loom') != null) {
            return true
        }
        try {
            return project.configurations.any { cfg ->
                try {
                    cfg.dependencies.any { dep ->
                        dep.group == 'org.spongepowered' || dep.group == 'net.fabricmc'
                    }
                } catch (Throwable ignored) {
                    false
                }
            }
        } catch (Throwable ignored) {
            return false
        }
    }

    def resolveRemoldConfig = {
        // 0. 解析目标 jar (若配置了 jar，进入纯净 JAR 模式)
        def jarProp = remoldExt.jar ?: project.findProperty('remold.jar') ?: project.findProperty('remoldJar')
        File targetJar = null
        if (jarProp != null) {
            targetJar = project.file(jarProp)
            if (!targetJar.exists()) {
                logger.warn("[Remold] 注意：指定的目标启动 JAR 尚不存在: ${targetJar.absolutePath}（非立即运行时可忽略）")
            }
        }

        // 1. 解析 mainClass
        def main = remoldExt.mainClass ?: project.findProperty('remold.mainClass') ?: project.findProperty('remoldMainClass')
        if (!main && project.extensions.findByName('application')) {
            main = (project.extensions.findByName('application') as JavaApplication).mainClass.orNull
        }
        if (!main && project.hasProperty('mainClassName')) {
            main = project.property('mainClassName')
        }
        if (!main && targetJar != null && targetJar.exists()) {
            try {
                def jf = new java.util.jar.JarFile(targetJar)
                main = jf.manifest?.mainAttributes?.getValue('Main-Class')
                jf.close()
            } catch (Exception ignored) { }
        }
        if (!main) {
            if (targetJar != null && targetJar.exists()) {
                throw new GradleException("[Remold] 未能从 ${targetJar.name} 的 MANIFEST.MF 中读取到 Main-Class，请在 remold { mainClass = '...' } 中显式指定。")
            } else if (targetJar != null) {
                main = 'unknown.MainClass'
            } else if (project.plugins.hasPlugin('fabric-loom') || project.extensions.findByName('loom') != null) {
                main = 'net.fabricmc.loader.impl.launch.knot.KnotClient'
            } else {
                throw new GradleException('[Remold] 未配置 mainClass 或 jar。请在 remold { mainClass = "..." }、remold { jar = "..." } 或 gradle.properties 中指定。')
            }
        }

        // 2. 解析运行用 JVM
        // 默认使用「运行 Gradle 的这个 JVM」——在 IDEA 里就是 Gradle JVM（项目 SDK），
        // 而不是 PATH / JAVA_HOME 里的 java，避免构建用的 SDK 与启动用的 JDK 不一致。
        def isWinOs = System.getProperty('os.name').toLowerCase().contains('win')

        // 由 JVM 家目录或 java 可执行文件反推出 IDE 认可的 JRE 家目录。
        // IDEA 的 ALTERNATIVE_JRE_PATH 只接受家目录（或已注册的 SDK 名），写入 ...\bin\java.exe
        // 会被判定为路径不存在并直接弹框拒绝启动。取不到时返回空串（此时不写该字段）。
        def toJreHome = { String path ->
            if (!path) return ''
            def f = new File(path)
            if (f.isFile() || f.name.equalsIgnoreCase('java') || f.name.equalsIgnoreCase('java.exe')) {
                def bin = f.parentFile
                if (bin == null || !bin.name.equalsIgnoreCase('bin')) return ''
                f = bin.parentFile
                if (f == null) return ''
            }
            // JDK 8 的 java.home 通常是 <jdk>/jre，向上取一层才是 IDE 认可的 JDK 家目录
            if (f.name.equalsIgnoreCase('jre')) {
                def parent = f.parentFile
                if (parent != null && new File(parent, isWinOs ? 'bin/java.exe' : 'bin/java').exists()) f = parent
            }
            return f.isDirectory() ? f.absolutePath : ''
        }

        def execPath = new File(System.getProperty('java.home'), isWinOs ? 'bin/java.exe' : 'bin/java').absolutePath
        def execHome = toJreHome(System.getProperty('java.home'))
        if (!new File(execPath).exists()) {
            execPath = 'java'
            execHome = ''
        }
        def jbr = remoldExt.jbrPath ?: project.findProperty('remold.jbr') ?: project.findProperty('jbr.home') ?: System.getenv('JBR_HOME') ?: System.getProperty('jbr.home')
        if (jbr) {
            def jbrDir = new File(jbr.toString())
            def javaBin = jbrDir.isFile() ? jbrDir : new File(jbrDir, isWinOs ? 'bin/java.exe' : 'bin/java')
            if (javaBin.exists()) {
                execPath = javaBin.absolutePath
                execHome = toJreHome(javaBin.absolutePath)
            } else {
                logger.warn("[Remold] 指定的 JBR 路径不存在: ${jbr}，将使用项目 SDK 的 JVM 运行。")
            }
        }

        def downloadRemoteJar = { String urlStr, File targetFile ->
            boolean ok = false
            String curUrl = urlStr
            for (int hop = 0; hop < 5; hop++) {
                try {
                    def uri = java.net.URI.create(curUrl)
                    def conn = uri.toURL().openConnection()
                    if (!(conn instanceof HttpURLConnection)) break
                    conn.connectTimeout = 10000
                    conn.readTimeout = 30000
                    conn.instanceFollowRedirects = true
                    conn.setRequestProperty("User-Agent", "Remold-Gradle-Plugin")
                    int code = conn.responseCode
                    if (code in 300..399) {
                        String loc = conn.getHeaderField("Location")
                        if (!loc) break
                        curUrl = loc.startsWith("http") ? loc : uri.resolve(loc).toString()
                        continue
                    }
                    if (code == 200) {
                        conn.inputStream.withCloseable { inStream ->
                            targetFile.withOutputStream { outStream ->
                                outStream << inStream
                            }
                        }
                        if (targetFile.exists() && targetFile.length() > 1024) {
                            ok = true
                            break
                        } else {
                            targetFile.delete()
                        }
                    }
                    break
                } catch (Exception ignored) {
                    targetFile.delete()
                    break
                }
            }
            return ok
        }

        // 统一的项目本地缓存目录：IDEA 运行配置只引用 $PROJECT_DIR$/.gradle/remold/ 下的副本，
        // 与 jar 的真实来源（仓库内构建输出 / libs / Gradle 缓存 / 远端下载）解耦。
        // 否则同一份配置里会出现 agent 指 build/libs、插件指 .gradle/remold 的混合路径。
        def localRemoldDir = new File(project.rootDir, '.gradle/remold')

        def syncIntoLocalRemold = { File src, File dest ->
            if (src == null || !src.exists()) return dest
            try {
                if (src.canonicalPath == dest.canonicalPath) return src
                if (dest.exists() && dest.length() == src.length() && dest.lastModified() == src.lastModified()) return dest
                dest.parentFile.mkdirs()
                java.nio.file.Files.copy(src.toPath(), dest.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                dest.setLastModified(src.lastModified())
                return dest
            } catch (Exception ignored) {
                return src
            }
        }

        // 3. 解析版本与 agent jar
        def ver = remoldExt.version ?: project.findProperty('remold.version') ?: project.findProperty('remoldVersion') ?: (project.rootProject.hasProperty('remoldVersion') ? project.rootProject.property('remoldVersion') : null)
        File agentFile = remoldExt.agentJar ? new File(remoldExt.agentJar.toString()) : null
        if (agentFile == null || !agentFile.exists()) {
            def candidates = [
                project.file('libs/remold-agent.jar'),
                project.file('remold-agent.jar'),
                project.rootProject.file('core/build/libs/remold-agent.jar'),
                project.rootProject.file('../core/build/libs/remold-agent.jar'),
                // 上次同步到项目本地的副本：clean 掉 build/libs 后仍可用，
                // 避免静默退回 Gradle 缓存里的发布版 agent（版本可能对不上）
                new File(localRemoldDir, 'remold-agent.jar')
            ]
            agentFile = candidates.find { it.exists() }
        }

        // 若本地未找到，尝试从 Gradle 依赖缓存或官方 Releases 自动下载
        if (agentFile == null || !agentFile.exists()) {
            if (!ver) {
                throw new GradleException('[Remold] 未配置 Remold 版本号！请在 remold { version = "..." } 或 gradle.properties (remold.version=...) 中指定。')
            }
            def cacheDir = new File(project.gradle.gradleUserHomeDir, "caches/remold")
            def cachedJar = new File(cacheDir, "remold-agent-${ver}.jar")

            if (cachedJar.exists() && cachedJar.length() > 1024) {
                agentFile = cachedJar
            } else {
                try {
                    def detached = project.configurations.detachedConfiguration(
                        project.dependencies.create("com.github.I-hope1.Remold:core:${ver}")
                    )
                    detached.transitive = false
                    def resolved = detached.resolve()
                    if (!resolved.isEmpty()) {
                        agentFile = resolved.first()
                    }
                } catch (Exception ignored) { }

                if (agentFile == null || !agentFile.exists()) {
                    try {
                        def detachedAll = project.configurations.detachedConfiguration(
                            project.dependencies.create("com.github.I-hope1.Remold:core:${ver}:all")
                        )
                        detachedAll.transitive = false
                        def resolvedAll = detachedAll.resolve()
                        if (!resolvedAll.isEmpty()) {
                            agentFile = resolvedAll.first()
                        }
                    } catch (Exception ignored) { }
                }

                if (agentFile == null || !agentFile.exists()) {
                    logger.lifecycle("[Remold] 本地未找到 agent jar，正在自动拉取 remold-agent.jar (版本: ${ver})...")
                    def downloadUrls = [
                        "https://github.com/I-hope1/Remold/releases/download/v${ver}/remold-agent.jar",
                        "https://github.com/I-hope1/Remold/releases/download/${ver}/remold-agent.jar"
                    ]
                    cacheDir.mkdirs()
                    for (String urlStr : downloadUrls) {
                        if (downloadRemoteJar(urlStr, cachedJar)) {
                            agentFile = cachedJar
                            logger.lifecycle("[Remold] agent jar 已自动就绪: ${cachedJar.absolutePath}")
                            break
                        }
                    }
                }
            }
        }

        if (agentFile == null || !agentFile.exists()) {
            throw new GradleException(
                "[Remold] 未找到且无法自动下载 remold-agent.jar (目标版本: ${remoldExt.version})！\n" +
                "请检查网络或在 remold { version = '...' } 中指定有效版本，\n" +
                "亦可在 remold { agentJar = '/path/to/remold-agent.jar' } 中显式指定本地文件。"
            )
        }

        // 无论来源（仓库内构建输出 / libs / Gradle 缓存 / 远端下载），一律同步到
        // .gradle/remold/remold-agent.jar，保证 IDEA 运行配置里 agent 与插件落在同一目录。
        agentFile = syncIntoLocalRemold(agentFile, new File(localRemoldDir, 'remold-agent.jar'))

        // 4. 自动推导编译输出与资源目录并拼装监听路径
        def classesDirs = sourceSets.main.output.classesDirs.files
        def resourceDirs = sourceSets.main.resources.srcDirs
        def assetsDir = new File(project.projectDir, "assets")
        def outResourceDir = sourceSets.main.output.resourcesDir
        def extraDirs = remoldExt.watchDirs.collect { project.file(it) }
        def allCandidateDirs = []
        allCandidateDirs.addAll(classesDirs)
        allCandidateDirs.addAll(resourceDirs)
        if (assetsDir != null) allCandidateDirs.add(assetsDir)
        if (outResourceDir != null) allCandidateDirs.add(outResourceDir)
        allCandidateDirs.addAll(extraDirs)
        def allWatchDirs = allCandidateDirs.findAll { it != null && it.exists() }.unique()
        def watchPath = allWatchDirs.collect { it.absolutePath }.join(File.pathSeparator)

        // 5. 装配 JVM 参数
        def args = [
            '-XX:+IgnoreUnrecognizedVMOptions',
            '-XX:+AllowEnhancedClassRedefinition',
            "-javaagent:${agentFile.absolutePath}=${watchPath}",
            '--add-exports=java.base/jdk.internal.misc=ALL-UNNAMED',
            '--add-exports=java.base/jdk.internal.reflect=ALL-UNNAMED',
            '--add-exports=java.base/jdk.internal.loader=ALL-UNNAMED',
            '--enable-native-access=ALL-UNNAMED'
        ]

        if (remoldExt.debug || 'true'.equalsIgnoreCase(System.getProperty('remold.debug'))) {
            def port = remoldExt.debugPort
            args << "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:${port}"
            logger.lifecycle("[Remold] JDWP 调试已开启，仅监听本机: 127.0.0.1:${port}")
        }

        if (remoldExt.extraJvmArgs) {
            args.addAll(remoldExt.extraJvmArgs)
        }
        if (remoldExt.fileShakeMs != null) {
            args << "-Dremold.agent.file_shake_ms=${remoldExt.fileShakeMs}"
        }

        // 6. 解析扩展插件配置 (如 arc / mixin)
        def requestedPlugins = []
        if (remoldExt.plugins) {
            requestedPlugins.addAll(remoldExt.plugins.collect { it.toString().trim() }.findAll { !it.isEmpty() })
        }
        def pluginProps = project.findProperty('remold.plugins') ?: project.findProperty('remoldPlugins')
        if (pluginProps) {
            requestedPlugins.addAll(pluginProps.toString().split('[,;]').collect { it.trim() }.findAll { !it.isEmpty() })
        }
        // 自动挂载：Mixin 生态项目（Fabric Loom / 声明了 Mixin 依赖）默认启用 plugin-mixin。
        // 可用 -Premold.autoMixin=false 关闭。
        def autoMixin = project.findProperty('remold.autoMixin') == null ? true : project.findProperty('remold.autoMixin').toString().toBoolean()
        if (autoMixin && !requestedPlugins.any { it.toString().equalsIgnoreCase('mixin') } && usesMixinEcosystem()) {
            requestedPlugins.add('mixin')
        }
        requestedPlugins = requestedPlugins.unique()

        def pluginJars = []
        // 显式指定的插件 Jar 优先（本地开发 Remold 插件时无需发布/缓存）
        remoldExt.pluginJars.each { explicit ->
            def f = project.file(explicit)
            if (f.exists()) {
                // 同样落到 .gradle/remold/plugins/，避免运行配置里出现仓库外的绝对路径
                pluginJars.add(syncIntoLocalRemold(f, new File(localRemoldDir, "plugins/${f.name}")))
            } else {
                logger.warn("[Remold] 指定的插件 Jar 不存在: ${f.absolutePath}")
            }
        }
        if (requestedPlugins) {
            for (String pluginName : requestedPlugins) {
                // 该插件已由显式 pluginJar(...) 提供时跳过解析
                if (pluginJars.any { it.name.contains("plugin-${pluginName}") }) {
                    continue
                }
                def pluginJarCandidates = [
                    project.rootProject.file("plugin-${pluginName}/build/libs/remold-plugin-${pluginName}-${ver}.jar"),
                    project.rootProject.file("plugin-${pluginName}/build/libs/remold-plugin-${pluginName}.jar"),
                    project.rootProject.file("../plugin-${pluginName}/build/libs/remold-plugin-${pluginName}-${ver}.jar"),
                    project.rootProject.file("../plugin-${pluginName}/build/libs/remold-plugin-${pluginName}.jar"),
                    ver ? new File(project.gradle.gradleUserHomeDir, "caches/remold/remold-plugin-${pluginName}-${ver}.jar") : null
                ].findAll { it != null }
                // 本地开发便利：模板与 Remold 本体仓库并排放置时（../<repo>/plugin-x/build/libs）
                try {
                    project.rootDir.parentFile?.listFiles()?.each { sibling ->
                        if (sibling.isDirectory) {
                            pluginJarCandidates.add(new File(sibling, "plugin-${pluginName}/build/libs/remold-plugin-${pluginName}-${ver}.jar"))
                            pluginJarCandidates.add(new File(sibling, "plugin-${pluginName}/build/libs/remold-plugin-${pluginName}.jar"))
                        }
                    }
                } catch (Throwable ignored) { }
                def resolvedPluginJar = pluginJarCandidates.find { it.exists() }

                if ((resolvedPluginJar == null || !resolvedPluginJar.exists()) && ver) {
                    try {
                        def detached = project.configurations.detachedConfiguration(
                            project.dependencies.create("com.github.I-hope1.Remold:plugin-${pluginName}:${ver}")
                        )
                        detached.transitive = false
                        def resolved = detached.resolve()
                        if (!resolved.isEmpty()) {
                            resolvedPluginJar = resolved.first()
                        }
                    } catch (Exception ignored) { }
                }

                if ((resolvedPluginJar == null || !resolvedPluginJar.exists()) && ver) {
                    def cacheDir = new File(project.gradle.gradleUserHomeDir, "caches/remold")
                    def cachedJar = new File(cacheDir, "remold-plugin-${pluginName}-${ver}.jar")
                    if (cachedJar.exists() && cachedJar.length() > 1024) {
                        resolvedPluginJar = cachedJar
                    } else {
                        logger.lifecycle("[Remold] 正在自动拉取插件: remold-plugin-${pluginName}.jar (版本: ${ver})...")
                        def pluginUrls = [
                            "https://github.com/I-hope1/Remold/releases/download/v${ver}/remold-plugin-${pluginName}-${ver}.jar",
                            "https://github.com/I-hope1/Remold/releases/download/v${ver}/remold-plugin-${pluginName}.jar",
                            "https://github.com/I-hope1/Remold/releases/download/${ver}/remold-plugin-${pluginName}-${ver}.jar",
                            "https://github.com/I-hope1/Remold/releases/download/${ver}/remold-plugin-${pluginName}.jar"
                        ]
                        cacheDir.mkdirs()
                        for (String urlStr : pluginUrls) {
                            if (downloadRemoteJar(urlStr, cachedJar)) {
                                resolvedPluginJar = cachedJar
                                logger.lifecycle("[Remold] 插件已自动就绪: ${cachedJar.absolutePath}")
                                break
                            }
                        }
                    }
                }

                if (resolvedPluginJar != null && resolvedPluginJar.exists()) {
                    // 与 agent 同口径：统一落到 .gradle/remold/plugins/，
                    // IDEA 配置里不再混入 plugin-x/build/libs 这类随 clean 消失的路径
                    pluginJars.add(syncIntoLocalRemold(resolvedPluginJar, new File(localRemoldDir, "plugins/${resolvedPluginJar.name}")))
                } else {
                    logger.warn("[Remold] 未找到插件 remold-plugin-${pluginName} 的 Jar 包，若已内嵌或无需外部 Jar 可忽略。")
                }
            }

            args << "-Dremold.plugins=${requestedPlugins.join(',')}"
            if (!pluginJars.isEmpty()) {
                def pluginJarsPath = pluginJars.collect { it.absolutePath }.join(File.pathSeparator)
                args << "-Dremold.plugin.jars=${pluginJarsPath}"
            }
        }

        def runtimeClasspath = targetJar != null ? project.files(targetJar) : sourceSets.main.runtimeClasspath
        def appArgs = remoldExt.args.collect { it.toString() }

        return [
            mainClass: main,
            executable: execPath,
            executableHome: execHome,
            agentFile: agentFile,
            allWatchDirs: allWatchDirs,
            watchPath: watchPath,
            jvmArgs: args,
            appArgs: appArgs,
            runtimeClasspath: runtimeClasspath,
            targetJar: targetJar
        ]
    }

    tasks.register('runRemold', JavaExec) {
        group = 'application'
        description = 'Runs the application with Remold Java Agent & JBR DCEVM (blocking foreground)'

        classpath = sourceSets.main.runtimeClasspath

        doFirst {
            def conf = resolveRemoldConfig()
            if (conf.targetJar != null && !conf.targetJar.exists()) {
                throw new GradleException("[Remold] 指定的目标启动 JAR 不存在，无法启动应用: ${conf.targetJar.absolutePath}")
            }
            mainClass.set(conf.mainClass)
            classpath = conf.runtimeClasspath
            if (conf.appArgs) {
                args(conf.appArgs)
            }
            if (conf.executable != 'java') {
                executable = conf.executable
            }
            jvmArgs(conf.jvmArgs)

            logger.lifecycle("[Remold] 启动配置已装配:")
            if (conf.targetJar != null) {
                logger.lifecycle("  - 目标启动 JAR: ${conf.targetJar.absolutePath}")
            }
            logger.lifecycle("  - 主类: ${conf.mainClass}")
            logger.lifecycle("  - Agent: ${conf.agentFile.absolutePath}")
            logger.lifecycle("  - Watch 目录 (${conf.allWatchDirs.size()} 个): ${conf.watchPath}")
            if (conf.appArgs) {
                logger.lifecycle("  - 应用参数: ${conf.appArgs.join(' ')}")
            }
            if (remoldExt.fileShakeMs != null) {
                logger.lifecycle("  - File Shake: ${remoldExt.fileShakeMs}ms")
            }
            if (conf.executable != 'java') {
                logger.lifecycle("  - JBR: ${conf.executable}")
            }
        }
    }

    def resolveDeployDir = {
        def dir = remoldExt.deployDir ?: remoldExt.modsDir ?: project.findProperty('remold.deployDir') ?: project.findProperty('remold.modsDir')
        if (dir != null) {
            return project.file(dir)
        }
        return null
    }

    tasks.register('deployArtifact', Copy) {
        group = 'application'
        description = 'Builds and deploys the output JAR into the specified deploy directory'
        dependsOn { project.tasks.findByName('remapJar') ?: 'jar' }
        doFirst {
            resolveRemoldConfig()
        }
        from { project.tasks.findByName('remapJar') ?: tasks.named('jar') }
        into {
            def target = resolveDeployDir()
            if (target == null) {
                throw new GradleException('[Remold] 开启了 autoDeploy 但未指定目标部署目录！请在 remold { deployDir = "..." } 或 gradle.properties (remold.deployDir=...) 中配置。')
            }
            return target
        }
        doLast {
            logger.lifecycle("[Remold] 产物已自动部署至: ${resolveDeployDir().absolutePath}")
        }
    }

    tasks.register('deployMod') {
        group = 'application'
        description = 'Alias for deployArtifact'
        dependsOn 'deployArtifact'
    }

    tasks.named('classes') {
        doLast {
            try {
                def localAgent = new File(project.rootDir, ".gradle/remold/remold-agent.jar")
                if (!localAgent.exists() || localAgent.length() <= 1024) {
                    resolveRemoldConfig()
                }
            } catch (Exception ignored) { }
        }
    }

    project.afterEvaluate {
        def shouldAutoDeploy = remoldExt.autoDeploy != null ? remoldExt.autoDeploy : (remoldExt.deployDir != null || remoldExt.modsDir != null || project.findProperty('remold.deployDir') != null || project.findProperty('remold.modsDir') != null)

        tasks.named('runRemold', JavaExec) {
            def jbr = remoldExt.jbrPath ?: System.getenv('JBR_HOME') ?: System.getProperty('jbr.home')
            if (jbr) {
                javaLauncher.set((JavaLauncher) null)
            }
            if (shouldAutoDeploy) {
                dependsOn 'deployArtifact'
            }
            if (remoldExt.dependsOn) {
                dependsOn remoldExt.dependsOn
            }
        }
        tasks.named('startRemold') {
            if (shouldAutoDeploy) {
                dependsOn 'deployArtifact'
            }
            if (remoldExt.dependsOn) {
                dependsOn remoldExt.dependsOn
            }
        }
        tasks.named('generateRemoldScript') {
            if (shouldAutoDeploy) {
                dependsOn 'deployArtifact'
            }
            if (remoldExt.dependsOn) {
                dependsOn remoldExt.dependsOn
            }
        }
        tasks.named('generateIdeaRunConfig') {
            if (shouldAutoDeploy) {
                dependsOn 'deployArtifact'
            }
            if (remoldExt.dependsOn) {
                dependsOn remoldExt.dependsOn
            }
        }
        if (shouldAutoDeploy) {
            tasks.findByName('runClient')?.dependsOn('deployArtifact')
        }

        def ideaDir = new File(project.rootDir, '.idea')
        def xmlFile = new File(project.rootDir, '.idea/runConfigurations/Run_with_Remold.xml')
        if (ideaDir.exists()) {
            tasks.findByName('classes')?.finalizedBy('generateIdeaRunConfig')
            if (!xmlFile.exists()) {
                try {
                    def out = generateIdeaRunConfigInternal()
                    if (out != null) {
                        logger.lifecycle("[Remold] 自动就绪 IntelliJ IDEA 运行配置: ${out.absolutePath}")
                    }
                } catch (Throwable ignored) {
                }
            }
        }

        // 自动适配 Fabric Loom 项目：注入 runClient 运行配置
        if (project.plugins.hasPlugin('fabric-loom') || project.extensions.findByName('loom') != null) {
            try {
                def loom = project.extensions.findByName('loom')
                if (loom != null) {
                    def runs = loom.getRuns()
                    def client = runs?.findByName('client')
                    if (client != null) {
                        def conf = resolveRemoldConfig()
                        for (arg in conf.jvmArgs) {
                            client.vmArg(arg)
                        }
                        logger.lifecycle("[Remold] 已自动为 Fabric Loom 的 runClient 注入热重载探针参数！")
                    }
                }
            } catch (Throwable ignored) {
            }
        }
    }

    def generateIdeaRunConfigInternal = {
        def conf = resolveRemoldConfig()
        def ideaRunDir = new File(project.rootDir, '.idea/runConfigurations')
        ideaRunDir.mkdirs()

        def xmlEscape = { String s ->
            if (s == null) return ''
            return s.replace('&', '&amp;')
                    .replace('"', '&quot;')
                    .replace('<', '&lt;')
                    .replace('>', '&gt;')
        }

        def makePortable = { String p ->
            if (p == null) return ''
            def rootPath = project.rootDir.absolutePath.replace('\\', '/')
            def norm = p.replace('\\', '/')
            def rootLower = rootPath.toLowerCase()
            while (true) {
                def normLower = norm.toLowerCase()
                def idx = normLower.indexOf(rootLower)
                if (idx == -1) break
                norm = norm.substring(0, idx) + '$PROJECT_DIR$' + norm.substring(idx + rootPath.length())
            }
            return norm
        }

        def portableJvmArgs = conf.jvmArgs.collect { makePortable(it) }.join(' ')
        def portableAppArgs = conf.appArgs.collect { makePortable(it) }.join(' ')
        // IDEA 的 ALTERNATIVE_JRE_PATH 只认 JRE/JDK 家目录（或已注册的 SDK 名），
        // 写 java.exe 会被判为无效并弹框拒绝启动；统一转成家目录，并改用 / 分隔以对齐 IDE 的注册表口径。
        def jrePath = (conf.executableHome ?: '').replace('\\', '/')
        def hasCustomJre = !jrePath.isEmpty()

        def xmlFile = new File(ideaRunDir, 'Run_with_Remold.xml')
        def xml = new StringBuilder()
        xml.append('<component name="ProjectRunConfigurationManager">\n')

        def isLoom = project.plugins.hasPlugin('fabric-loom') || project.extensions.findByName('loom') != null
        if (isLoom) {
            xml.append('  <configuration default="false" name="Run with Remold" type="GradleRunConfiguration" factoryName="Gradle">\n')
            xml.append('    <ExternalSystemSettings>\n')
            xml.append('      <option name="executionName" />\n')
            xml.append('      <option name="externalProjectPath" value="$PROJECT_DIR$" />\n')
            xml.append('      <option name="externalSystemIdString" value="GRADLE" />\n')
            xml.append('      <option name="scriptParameters" value="" />\n')
            xml.append('      <option name="taskDescriptions">\n')
            xml.append('        <list />\n')
            xml.append('      </option>\n')
            xml.append('      <option name="taskNames">\n')
            xml.append('        <list>\n')
            xml.append('          <option value="runClient" />\n')
            xml.append('        </list>\n')
            xml.append('      </option>\n')
            xml.append('      <option name="vmOptions" value="" />\n')
            xml.append('    </ExternalSystemSettings>\n')
            xml.append('    <ExternalSystemDebugServerProcess>true</ExternalSystemDebugServerProcess>\n')
            xml.append('    <ExternalSystemReAttachDebugProcess>true</ExternalSystemReAttachDebugProcess>\n')
            xml.append('    <DebugAllEnabled>false</DebugAllEnabled>\n')
            xml.append('    <RunAsTest>false</RunAsTest>\n')
            xml.append('    <method v="2" />\n')
            xml.append('  </configuration>\n')
        } else if (conf.targetJar != null) {
            def portableJar = makePortable(conf.targetJar.absolutePath)
            xml.append('  <configuration default="false" name="Run with Remold" type="JarApplication">\n')
            xml.append("    <option name=\"JAR_PATH\" value=\"${xmlEscape(portableJar)}\" />\n")
            xml.append("    <option name=\"VM_PARAMETERS\" value=\"${xmlEscape(portableJvmArgs)}\" />\n")
            if (portableAppArgs) {
                xml.append("    <option name=\"PROGRAM_PARAMETERS\" value=\"${xmlEscape(portableAppArgs)}\" />\n")
            }
            xml.append('    <option name=\"WORKING_DIRECTORY\" value=\"$PROJECT_DIR$\" />\n')
            if (hasCustomJre) {
                xml.append("    <option name=\"ALTERNATIVE_JRE_PATH\" value=\"${xmlEscape(jrePath)}\" />\n")
                xml.append('    <option name=\"ALTERNATIVE_JRE_PATH_ENABLED\" value=\"true\" />\n')
            }
            xml.append('    <method v=\"2\">\n')
            def shouldAutoDeploy = remoldExt.autoDeploy != null ? remoldExt.autoDeploy : (remoldExt.deployDir != null || remoldExt.modsDir != null || project.findProperty('remold.deployDir') != null || project.findProperty('remold.modsDir') != null)
            if (shouldAutoDeploy) {
                xml.append('      <option name=\"Gradle.BeforeRunTask\" enabled=\"true\" tasks=\"deployArtifact\" externalProjectPath=\"$PROJECT_DIR$\" />\n')
            } else {
                xml.append('      <option name=\"Gradle.BeforeRunTask\" enabled=\"true\" tasks=\"classes\" externalProjectPath=\"$PROJECT_DIR$\" />\n')
            }
            xml.append('    </method>\n')
            xml.append('  </configuration>\n')
        } else {
            def moduleName = "${project.name}.main"
            xml.append('  <configuration default="false" name="Run with Remold" type="Application" factoryName="Application">\n')
            xml.append("    <option name=\"MAIN_CLASS_NAME\" value=\"${xmlEscape(conf.mainClass)}\" />\n")
            xml.append("    <module name=\"${xmlEscape(moduleName)}\" />\n")
            xml.append("    <option name=\"VM_PARAMETERS\" value=\"${xmlEscape(portableJvmArgs)}\" />\n")
            if (portableAppArgs) {
                xml.append("    <option name=\"PROGRAM_PARAMETERS\" value=\"${xmlEscape(portableAppArgs)}\" />\n")
            }
            xml.append('    <option name=\"WORKING_DIRECTORY\" value=\"$PROJECT_DIR$\" />\n')
            if (hasCustomJre) {
                xml.append("    <option name=\"ALTERNATIVE_JRE_PATH\" value=\"${xmlEscape(jrePath)}\" />\n")
                xml.append('    <option name=\"ALTERNATIVE_JRE_PATH_ENABLED\" value=\"true\" />\n')
            }
            xml.append('    <method v=\"2\">\n')
            xml.append('      <option name=\"Make\" enabled=\"true\" />\n')
            xml.append('    </method>\n')
            xml.append('  </configuration>\n')
        }
        xml.append('</component>\n')

        xmlFile.text = xml.toString()
        return xmlFile
    }

    tasks.register('generateIdeaRunConfig') {
        group = 'application'
        description = 'Generates IntelliJ IDEA run configuration into .idea/runConfigurations/Run_with_Remold.xml'
        dependsOn 'classes'

        doLast {
            def xmlFile = generateIdeaRunConfigInternal()
            if (xmlFile != null) {
                logger.lifecycle("[Remold] 已生成 IntelliJ IDEA 运行配置: ${xmlFile.absolutePath}")
                logger.lifecycle("[Remold] 用 IDEA 打开本项目即可直接点击右上角运行 / 调试按钮！")
            }
        }
    }

    tasks.register('generateRemoldScript') {
        group = 'application'
        description = 'Generates native standalone launcher scripts and args file to run Remold without Gradle Daemon'
        dependsOn 'classes', 'generateIdeaRunConfig'

        doLast {
            def conf = resolveRemoldConfig()
            if (conf.targetJar != null && !conf.targetJar.exists()) {
                throw new GradleException("[Remold] 指定的目标启动 JAR 不存在，无法启动应用: ${conf.targetJar.absolutePath}")
            }
            def buildDir = project.layout.buildDirectory.asFile.get()
            def remoldDir = new File(buildDir, 'remold')
            remoldDir.mkdirs()

            def argsFile = new File(remoldDir, 'remold.args')
            def lines = []
            lines.addAll(conf.jvmArgs)
            lines << '-cp'
            lines << conf.runtimeClasspath.asPath
            lines << conf.mainClass
            if (conf.appArgs) {
                lines.addAll(conf.appArgs)
            }

            argsFile.withWriter('UTF-8') { writer ->
                lines.each { line ->
                    if (line.contains(' ') || line.contains('\t')) {
                        writer.writeLine("\"${line.replace('\\', '\\\\')}\"")
                    } else {
                        writer.writeLine(line)
                    }
                }
            }

            def batFile = new File(buildDir, 'run-remold.bat')
            batFile.text = "@echo off\r\nset \"JAVA_EXE=${conf.executable}\"\r\nif not exist \"%JAVA_EXE%\" set \"JAVA_EXE=java\"\r\n\"%JAVA_EXE%\" @\"%~dp0remold\\remold.args\" %*\r\n"

            def shFile = new File(buildDir, 'run-remold.sh')
            shFile.text = "#!/usr/bin/env bash\nDIR=\"\$(cd \"\$(dirname \"\${BASH_SOURCE[0]}\")\" && pwd)\"\nJAVA_EXE=\"${conf.executable}\"\nif [ ! -f \"\$JAVA_EXE\" ]; then\n    JAVA_EXE=\"java\"\nfi\nexec \"\$JAVA_EXE\" \"@\$DIR/remold/remold.args\" \"\$@\"\n"
            try {
                shFile.setExecutable(true, false)
            } catch (Exception ignored) { }

            logger.lifecycle("[Remold] 已生成原生启动脚本:")
            logger.lifecycle("  - Windows: ${batFile.absolutePath}")
            logger.lifecycle("  - Linux/macOS: ${shFile.absolutePath}")
            logger.lifecycle("  - Args 文件: ${argsFile.absolutePath}")
            logger.lifecycle("[Remold] 直接运行脚本即可启动应用，不经由 Gradle，零 Daemon 占用！")
        }
    }

    tasks.register('startRemold') {
        group = 'application'
        description = 'Starts the application in a detached process so Gradle Daemon is immediately freed'
        dependsOn 'generateRemoldScript'

        doLast {
            def conf = resolveRemoldConfig()
            if (conf.targetJar != null && !conf.targetJar.exists()) {
                throw new GradleException("[Remold] 指定的目标启动 JAR 不存在，无法启动应用: ${conf.targetJar.absolutePath}")
            }
            def buildDir = project.layout.buildDirectory.asFile.get()
            def argsFile = new File(buildDir, 'remold/remold.args')
            def isWin = System.getProperty('os.name').toLowerCase().contains('win')

            if (isWin) {
                new ProcessBuilder('cmd', '/c', 'start', "\"Remold [${project.name}]\"", conf.executable, "@${argsFile.absolutePath}")
                    .directory(project.projectDir)
                    .start()
                logger.lifecycle("[Remold] 应用已在独立控制台窗口启动！")
            } else {
                def logFile = new File(buildDir, 'remold/remold.log')
                new ProcessBuilder(conf.executable, "@${argsFile.absolutePath}")
                    .directory(project.projectDir)
                    .redirectOutput(logFile)
                    .redirectErrorStream(true)
                    .start()
                logger.lifecycle("[Remold] 应用已在后台脱离启动！输出日志: ${logFile.absolutePath}")
            }
            logger.lifecycle("[Remold] Gradle Daemon 已立即释放 (IDLE)。随时可在终端执行 ./gradlew compileJava 触发热重载。")
        }
    }
}
