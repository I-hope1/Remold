// Remold Gradle Script Plugin (Groovy DSL)
// Usage: apply from: 'remold.gradle' (or raw GitHub URL)

import org.gradle.api.plugins.JavaApplication

class RemoldExtension {
    String version
    String agentJar
    String jbrPath
    boolean debug = false
    int debugPort = 5005
    String mainClass
    Object jar
    List<Object> args = []
    List<Object> watchDirs = []
    List<String> extraJvmArgs = []
    Integer fileShakeMs
    List<Object> dependsOn = []
    Object deployDir
    Object modsDir
    Boolean autoDeploy

    void jar(Object jar) {
        this.jar = jar
    }

    void args(Object... args) {
        if (args != null) {
            this.args.addAll(args as List)
        }
    }

    void dependsOn(Object... tasks) {
        if (tasks != null) {
            this.dependsOn.addAll(tasks as List)
        }
    }

    void deployDir(Object dir) {
        this.deployDir = dir
        this.autoDeploy = true
    }

    void modsDir(Object dir) {
        this.modsDir = dir
        this.autoDeploy = true
    }
}

def remoldExt = project.extensions.create('remold', RemoldExtension)

project.plugins.withId('java') {
    def sourceSets = project.extensions.getByType(SourceSetContainer)

    def resolveRemoldConfig = {
        // 0. 解析目标 jar (若配置了 jar，进入纯净 JAR 模式)
        def jarProp = remoldExt.jar ?: project.findProperty('remold.jar') ?: project.findProperty('remoldJar')
        File targetJar = null
        if (jarProp != null) {
            targetJar = project.file(jarProp)
            if (!targetJar.exists()) {
                logger.warn("[Remold] 注意：指定的目标启动 JAR 尚不存在: ${targetJar.absolutePath}（非立即运行时可忽略）")
            }
        }

        // 1. 解析 mainClass
        def main = remoldExt.mainClass ?: project.findProperty('remold.mainClass') ?: project.findProperty('remoldMainClass')
        if (!main && project.extensions.findByName('application')) {
            main = (project.extensions.findByName('application') as JavaApplication).mainClass.orNull
        }
        if (!main && project.hasProperty('mainClassName')) {
            main = project.property('mainClassName')
        }
        if (!main && targetJar != null && targetJar.exists()) {
            try {
                def jf = new java.util.jar.JarFile(targetJar)
                main = jf.manifest?.mainAttributes?.getValue('Main-Class')
                jf.close()
            } catch (Exception ignored) { }
        }
        if (!main) {
            if (targetJar != null && targetJar.exists()) {
                throw new GradleException("[Remold] 未能从 ${targetJar.name} 的 MANIFEST.MF 中读取到 Main-Class，请在 remold { mainClass = '...' } 中显式指定。")
            } else if (targetJar != null) {
                main = 'unknown.MainClass'
            } else {
                throw new GradleException('[Remold] 未配置 mainClass 或 jar。请在 remold { mainClass = "..." }、remold { jar = "..." } 或 gradle.properties 中指定。')
            }
        }

        // 2. 解析 JBR 路径
        def execPath = 'java'
        def jbr = remoldExt.jbrPath ?: project.findProperty('remold.jbr') ?: project.findProperty('jbr.home') ?: System.getenv('JBR_HOME') ?: System.getProperty('jbr.home')
        if (jbr) {
            def jbrDir = new File(jbr.toString())
            def isWin = System.getProperty('os.name').toLowerCase().contains('win')
            def javaBin = jbrDir.isFile() ? jbrDir : new File(jbrDir, isWin ? 'bin/java.exe' : 'bin/java')
            if (javaBin.exists()) {
                execPath = javaBin.absolutePath
            } else {
                logger.warn("[Remold] 指定的 JBR 路径不存在: ${jbr}，将使用默认 JVM 运行。")
            }
        }

        // 3. 解析 agent jar
        File agentFile = remoldExt.agentJar ? new File(remoldExt.agentJar.toString()) : null
        if (agentFile == null || !agentFile.exists()) {
            def candidates = [
                project.file('libs/remold-agent.jar'),
                project.file('remold-agent.jar'),
                project.rootProject.file('core/build/libs/remold-agent.jar')
            ]
            agentFile = candidates.find { it.exists() }
        }

        // 若本地未找到，尝试从 Gradle 依赖缓存或官方 Releases 自动下载
        if (agentFile == null || !agentFile.exists()) {
            def ver = remoldExt.version ?: project.findProperty('remold.version') ?: project.findProperty('remoldVersion') ?: (project.rootProject.hasProperty('remoldVersion') ? project.rootProject.property('remoldVersion') : null)
            if (!ver) {
                throw new GradleException('[Remold] 未配置 Remold 版本号！请在 remold { version = "..." } 或 gradle.properties (remold.version=...) 中指定。')
            }
            def cacheDir = new File(project.gradle.gradleUserHomeDir, "caches/remold")
            def cachedJar = new File(cacheDir, "remold-agent-${ver}.jar")

            if (cachedJar.exists() && cachedJar.length() > 1024) {
                agentFile = cachedJar
            } else {
                try {
                    def detached = project.configurations.detachedConfiguration(
                        project.dependencies.create("com.github.I-hope1.Remold:core:${ver}")
                    )
                    detached.transitive = false
                    def resolved = detached.resolve()
                    if (!resolved.isEmpty()) {
                        agentFile = resolved.first()
                    }
                } catch (Exception ignored) { }

                if (agentFile == null || !agentFile.exists()) {
                    logger.lifecycle("[Remold] 本地未找到 agent jar，正在自动拉取 remold-agent.jar (版本: ${ver})...")
                    def downloadUrls = [
                        "https://github.com/I-hope1/Remold/releases/download/v${ver}/remold-agent.jar",
                        "https://github.com/I-hope1/Remold/releases/download/${ver}/remold-agent.jar"
                    ]
                    cacheDir.mkdirs()
                    for (String urlStr : downloadUrls) {
                        try {
                            def uri = java.net.URI.create(urlStr)
                            def conn = uri.toURL().openConnection()
                            conn.setConnectTimeout(10000)
                            conn.setReadTimeout(30000)
                            if (conn instanceof HttpURLConnection) {
                                conn.instanceFollowRedirects = true
                                int code = conn.responseCode
                                if (code in 300..399) {
                                    String loc = conn.getHeaderField("Location")
                                    if (loc) {
                                        conn = java.net.URI.create(loc).toURL().openConnection()
                                        conn.setConnectTimeout(10000)
                                        conn.setReadTimeout(30000)
                                    }
                                }
                            }
                            conn.inputStream.withCloseable { inStream ->
                                cachedJar.withOutputStream { outStream ->
                                    outStream << inStream
                                }
                            }
                            if (cachedJar.exists() && cachedJar.length() > 1024) {
                                agentFile = cachedJar
                                logger.lifecycle("[Remold] agent jar 已自动就绪: ${cachedJar.absolutePath}")
                                break
                            } else {
                                cachedJar.delete()
                            }
                        } catch (Exception ignored) {
                            cachedJar.delete()
                        }
                    }
                }
            }
        }

        if (agentFile == null || !agentFile.exists()) {
            throw new GradleException(
                "[Remold] 未找到且无法自动下载 remold-agent.jar (目标版本: ${remoldExt.version})！\n" +
                "请检查网络或在 remold { version = '...' } 中指定有效版本，\n" +
                "亦可在 remold { agentJar = '/path/to/remold-agent.jar' } 中显式指定本地文件。"
            )
        }

        // 同步一份到项目目录 .gradle/remold/ 以支持 IDEA 运行配置使用 $PROJECT_DIR$ 便携相对路径
        try {
            def rootCanonical = project.rootDir.canonicalPath
            def agentCanonical = agentFile.canonicalPath
            if (!agentCanonical.startsWith(rootCanonical)) {
                def localAgent = new File(project.rootDir, ".gradle/remold/remold-agent.jar")
                if (!localAgent.exists() || localAgent.length() != agentFile.length()) {
                    localAgent.parentFile.mkdirs()
                    java.nio.file.Files.copy(agentFile.toPath(), localAgent.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
                }
                agentFile = localAgent
            }
        } catch (Exception ignored) { }

        // 4. 自动推导编译输出目录并拼装监听路径
        def classesDirs = sourceSets.main.output.classesDirs.files
        def extraDirs = remoldExt.watchDirs.collect { project.file(it) }
        def allWatchDirs = (classesDirs + extraDirs).findAll { it.exists() }
        def watchPath = allWatchDirs.collect { it.absolutePath }.join(File.pathSeparator)

        // 5. 装配 JVM 参数
        def args = [
            '-XX:+AllowEnhancedClassRedefinition',
            "-javaagent:${agentFile.absolutePath}=${watchPath}",
            '--add-exports=java.base/jdk.internal.misc=ALL-UNNAMED',
            '--add-exports=java.base/jdk.internal.reflect=ALL-UNNAMED',
            '--add-exports=java.base/jdk.internal.loader=ALL-UNNAMED',
            '--enable-native-access=ALL-UNNAMED'
        ]

        if (remoldExt.debug || 'true'.equalsIgnoreCase(System.getProperty('remold.debug'))) {
            def port = remoldExt.debugPort
            args << "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=127.0.0.1:${port}"
            logger.lifecycle("[Remold] JDWP 调试已开启，仅监听本机: 127.0.0.1:${port}")
        }

        if (remoldExt.extraJvmArgs) {
            args.addAll(remoldExt.extraJvmArgs)
        }
        if (remoldExt.fileShakeMs != null) {
            args << "-Dremold.agent.file_shake_ms=${remoldExt.fileShakeMs}"
        }

        def runtimeClasspath = targetJar != null ? project.files(targetJar) : sourceSets.main.runtimeClasspath
        def appArgs = remoldExt.args.collect { it.toString() }

        return [
            mainClass: main,
            executable: execPath,
            agentFile: agentFile,
            allWatchDirs: allWatchDirs,
            watchPath: watchPath,
            jvmArgs: args,
            appArgs: appArgs,
            runtimeClasspath: runtimeClasspath,
            targetJar: targetJar
        ]
    }

    tasks.register('runRemold', JavaExec) {
        group = 'application'
        description = 'Runs the application with Remold Java Agent & JBR DCEVM (blocking foreground)'

        classpath = sourceSets.main.runtimeClasspath

        doFirst {
            def conf = resolveRemoldConfig()
            if (conf.targetJar != null && !conf.targetJar.exists()) {
                throw new GradleException("[Remold] 指定的目标启动 JAR 不存在，无法启动应用: ${conf.targetJar.absolutePath}")
            }
            mainClass.set(conf.mainClass)
            classpath = conf.runtimeClasspath
            if (conf.appArgs) {
                args(conf.appArgs)
            }
            if (conf.executable != 'java') {
                executable = conf.executable
            }
            jvmArgs(conf.jvmArgs)

            logger.lifecycle("[Remold] 启动配置已装配:")
            if (conf.targetJar != null) {
                logger.lifecycle("  - 目标启动 JAR: ${conf.targetJar.absolutePath}")
            }
            logger.lifecycle("  - 主类: ${conf.mainClass}")
            logger.lifecycle("  - Agent: ${conf.agentFile.absolutePath}")
            logger.lifecycle("  - Watch 目录 (${conf.allWatchDirs.size()} 个): ${conf.watchPath}")
            if (conf.appArgs) {
                logger.lifecycle("  - 应用参数: ${conf.appArgs.join(' ')}")
            }
            if (remoldExt.fileShakeMs != null) {
                logger.lifecycle("  - File Shake: ${remoldExt.fileShakeMs}ms")
            }
            if (conf.executable != 'java') {
                logger.lifecycle("  - JBR: ${conf.executable}")
            }
        }
    }

    def resolveDeployDir = {
        def dir = remoldExt.deployDir ?: remoldExt.modsDir ?: project.findProperty('remold.deployDir') ?: project.findProperty('remold.modsDir')
        if (dir != null) {
            return project.file(dir)
        }
        return null
    }

    tasks.register('deployArtifact', Copy) {
        group = 'application'
        description = 'Builds and deploys the output JAR into the specified deploy directory'
        dependsOn 'jar'
        doFirst {
            resolveRemoldConfig()
        }
        from tasks.named('jar')
        into {
            def target = resolveDeployDir()
            if (target == null) {
                throw new GradleException('[Remold] 开启了 autoDeploy 但未指定目标部署目录！请在 remold { deployDir = "..." } 或 gradle.properties (remold.deployDir=...) 中配置。')
            }
            return target
        }
        doLast {
            logger.lifecycle("[Remold] 产物已自动部署至: ${resolveDeployDir().absolutePath}")
        }
    }

    tasks.register('deployMod') {
        group = 'application'
        description = 'Alias for deployArtifact'
        dependsOn 'deployArtifact'
    }

    tasks.named('classes') {
        doLast {
            try {
                def localAgent = new File(project.rootDir, ".gradle/remold/remold-agent.jar")
                if (!localAgent.exists() || localAgent.length() <= 1024) {
                    resolveRemoldConfig()
                }
            } catch (Exception ignored) { }
        }
    }

    project.afterEvaluate {
        def shouldAutoDeploy = remoldExt.autoDeploy != null ? remoldExt.autoDeploy : (remoldExt.deployDir != null || remoldExt.modsDir != null || project.findProperty('remold.deployDir') != null || project.findProperty('remold.modsDir') != null)

        tasks.named('runRemold', JavaExec) {
            def jbr = remoldExt.jbrPath ?: System.getenv('JBR_HOME') ?: System.getProperty('jbr.home')
            if (jbr) {
                javaLauncher.set((JavaLauncher) null)
            }
            if (shouldAutoDeploy) {
                dependsOn 'deployArtifact'
            }
            if (remoldExt.dependsOn) {
                dependsOn remoldExt.dependsOn
            }
        }
        tasks.named('startRemold') {
            if (shouldAutoDeploy) {
                dependsOn 'deployArtifact'
            }
            if (remoldExt.dependsOn) {
                dependsOn remoldExt.dependsOn
            }
        }
        tasks.named('generateRemoldScript') {
            if (shouldAutoDeploy) {
                dependsOn 'deployArtifact'
            }
            if (remoldExt.dependsOn) {
                dependsOn remoldExt.dependsOn
            }
        }
        tasks.named('generateIdeaRunConfig') {
            if (shouldAutoDeploy) {
                dependsOn 'deployArtifact'
            }
            if (remoldExt.dependsOn) {
                dependsOn remoldExt.dependsOn
            }
        }
    }

    tasks.register('generateIdeaRunConfig') {
        group = 'application'
        description = 'Generates IntelliJ IDEA run configuration into .idea/runConfigurations/Run_with_Remold.xml'
        dependsOn 'classes'

        doLast {
            def conf = resolveRemoldConfig()
            def ideaRunDir = new File(project.rootDir, '.idea/runConfigurations')
            ideaRunDir.mkdirs()

            def xmlEscape = { String s ->
                if (s == null) return ''
                return s.replace('&', '&amp;')
                        .replace('"', '&quot;')
                        .replace('<', '&lt;')
                        .replace('>', '&gt;')
            }

            def makePortable = { String p ->
                if (p == null) return ''
                def rootPath = project.rootDir.absolutePath.replace('\\', '/')
                def norm = p.replace('\\', '/')
                def rootLower = rootPath.toLowerCase()
                while (true) {
                    def normLower = norm.toLowerCase()
                    def idx = normLower.indexOf(rootLower)
                    if (idx == -1) break
                    norm = norm.substring(0, idx) + '$PROJECT_DIR$' + norm.substring(idx + rootPath.length())
                }
                return norm
            }

            def portableJvmArgs = conf.jvmArgs.collect { makePortable(it) }.join(' ')
            def portableAppArgs = conf.appArgs.collect { makePortable(it) }.join(' ')
            def jrePath = conf.executable != 'java' ? conf.executable : ''
            def hasCustomJre = !jrePath.isEmpty()

            def xmlFile = new File(ideaRunDir, 'Run_with_Remold.xml')
            def xml = new StringBuilder()
            xml.append('<component name="ProjectRunConfigurationManager">\n')

            if (conf.targetJar != null) {
                def portableJar = makePortable(conf.targetJar.absolutePath)
                xml.append('  <configuration default="false" name="Run with Remold" type="JarApplication">\n')
                xml.append("    <option name=\"JAR_PATH\" value=\"${xmlEscape(portableJar)}\" />\n")
                xml.append("    <option name=\"VM_PARAMETERS\" value=\"${xmlEscape(portableJvmArgs)}\" />\n")
                if (portableAppArgs) {
                    xml.append("    <option name=\"PROGRAM_PARAMETERS\" value=\"${xmlEscape(portableAppArgs)}\" />\n")
                }
                xml.append('    <option name=\"WORKING_DIRECTORY\" value=\"$PROJECT_DIR$\" />\n')
                if (hasCustomJre) {
                    xml.append("    <option name=\"ALTERNATIVE_JRE_PATH\" value=\"${xmlEscape(jrePath)}\" />\n")
                    xml.append('    <option name=\"ALTERNATIVE_JRE_PATH_ENABLED\" value=\"true\" />\n')
                }
                xml.append('    <method v=\"2\">\n')
                def shouldAutoDeploy = remoldExt.autoDeploy != null ? remoldExt.autoDeploy : (remoldExt.deployDir != null || remoldExt.modsDir != null || project.findProperty('remold.deployDir') != null || project.findProperty('remold.modsDir') != null)
                if (shouldAutoDeploy) {
                    xml.append('      <option name=\"Gradle.BeforeRunTask\" enabled=\"true\" tasks=\"deployArtifact\" externalProjectPath=\"$PROJECT_DIR$\" />\n')
                } else {
                    xml.append('      <option name=\"Gradle.BeforeRunTask\" enabled=\"true\" tasks=\"classes\" externalProjectPath=\"$PROJECT_DIR$\" />\n')
                }
                xml.append('    </method>\n')
                xml.append('  </configuration>\n')
            } else {
                def moduleName = "${project.name}.main"
                xml.append('  <configuration default="false" name="Run with Remold" type="Application" factoryName="Application">\n')
                xml.append("    <option name=\"MAIN_CLASS_NAME\" value=\"${xmlEscape(conf.mainClass)}\" />\n")
                xml.append("    <module name=\"${xmlEscape(moduleName)}\" />\n")
                xml.append("    <option name=\"VM_PARAMETERS\" value=\"${xmlEscape(portableJvmArgs)}\" />\n")
                if (portableAppArgs) {
                    xml.append("    <option name=\"PROGRAM_PARAMETERS\" value=\"${xmlEscape(portableAppArgs)}\" />\n")
                }
                xml.append('    <option name=\"WORKING_DIRECTORY\" value=\"$PROJECT_DIR$\" />\n')
                if (hasCustomJre) {
                    xml.append("    <option name=\"ALTERNATIVE_JRE_PATH\" value=\"${xmlEscape(jrePath)}\" />\n")
                    xml.append('    <option name=\"ALTERNATIVE_JRE_PATH_ENABLED\" value=\"true\" />\n')
                }
                xml.append('    <method v=\"2\">\n')
                xml.append('      <option name=\"Make\" enabled=\"true\" />\n')
                xml.append('    </method>\n')
                xml.append('  </configuration>\n')
            }
            xml.append('</component>\n')

            xmlFile.text = xml.toString()
            logger.lifecycle("[Remold] 已生成 IntelliJ IDEA 运行配置: ${xmlFile.absolutePath}")
            logger.lifecycle("[Remold] 用 IDEA 打开本项目即可直接点击右上角运行 / 调试按钮！")
        }
    }

    tasks.register('generateRemoldScript') {
        group = 'application'
        description = 'Generates native standalone launcher scripts and args file to run Remold without Gradle Daemon'
        dependsOn 'classes', 'generateIdeaRunConfig'

        doLast {
            def conf = resolveRemoldConfig()
            if (conf.targetJar != null && !conf.targetJar.exists()) {
                throw new GradleException("[Remold] 指定的目标启动 JAR 不存在，无法启动应用: ${conf.targetJar.absolutePath}")
            }
            def buildDir = project.layout.buildDirectory.asFile.get()
            def remoldDir = new File(buildDir, 'remold')
            remoldDir.mkdirs()

            def argsFile = new File(remoldDir, 'remold.args')
            def lines = []
            lines.addAll(conf.jvmArgs)
            lines << '-cp'
            lines << conf.runtimeClasspath.asPath
            lines << conf.mainClass
            if (conf.appArgs) {
                lines.addAll(conf.appArgs)
            }

            argsFile.withWriter('UTF-8') { writer ->
                lines.each { line ->
                    if (line.contains(' ') || line.contains('\t')) {
                        writer.writeLine("\"${line.replace('\\', '\\\\')}\"")
                    } else {
                        writer.writeLine(line)
                    }
                }
            }

            def batFile = new File(buildDir, 'run-remold.bat')
            batFile.text = "@echo off\r\nset \"JAVA_EXE=${conf.executable}\"\r\nif not exist \"%JAVA_EXE%\" set \"JAVA_EXE=java\"\r\n\"%JAVA_EXE%\" @\"%~dp0remold\\remold.args\" %*\r\n"

            def shFile = new File(buildDir, 'run-remold.sh')
            shFile.text = "#!/usr/bin/env bash\nDIR=\"\$(cd \"\$(dirname \"\${BASH_SOURCE[0]}\")\" && pwd)\"\nJAVA_EXE=\"${conf.executable}\"\nif [ ! -f \"\$JAVA_EXE\" ]; then\n    JAVA_EXE=\"java\"\nfi\nexec \"\$JAVA_EXE\" \"@\$DIR/remold/remold.args\" \"\$@\"\n"
            try {
                shFile.setExecutable(true, false)
            } catch (Exception ignored) { }

            logger.lifecycle("[Remold] 已生成原生启动脚本:")
            logger.lifecycle("  - Windows: ${batFile.absolutePath}")
            logger.lifecycle("  - Linux/macOS: ${shFile.absolutePath}")
            logger.lifecycle("  - Args 文件: ${argsFile.absolutePath}")
            logger.lifecycle("[Remold] 直接运行脚本即可启动应用，不经由 Gradle，零 Daemon 占用！")
        }
    }

    tasks.register('startRemold') {
        group = 'application'
        description = 'Starts the application in a detached process so Gradle Daemon is immediately freed'
        dependsOn 'generateRemoldScript'

        doLast {
            def conf = resolveRemoldConfig()
            if (conf.targetJar != null && !conf.targetJar.exists()) {
                throw new GradleException("[Remold] 指定的目标启动 JAR 不存在，无法启动应用: ${conf.targetJar.absolutePath}")
            }
            def buildDir = project.layout.buildDirectory.asFile.get()
            def argsFile = new File(buildDir, 'remold/remold.args')
            def isWin = System.getProperty('os.name').toLowerCase().contains('win')

            if (isWin) {
                new ProcessBuilder('cmd', '/c', 'start', "\"Remold [${project.name}]\"", conf.executable, "@${argsFile.absolutePath}")
                    .directory(project.projectDir)
                    .start()
                logger.lifecycle("[Remold] 应用已在独立控制台窗口启动！")
            } else {
                def logFile = new File(buildDir, 'remold/remold.log')
                new ProcessBuilder(conf.executable, "@${argsFile.absolutePath}")
                    .directory(project.projectDir)
                    .redirectOutput(logFile)
                    .redirectErrorStream(true)
                    .start()
                logger.lifecycle("[Remold] 应用已在后台脱离启动！输出日志: ${logFile.absolutePath}")
            }
            logger.lifecycle("[Remold] Gradle Daemon 已立即释放 (IDLE)。随时可在终端执行 ./gradlew compileJava 触发热重载。")
        }
    }
}
