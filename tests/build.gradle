// DCEVM 探针的公共配置：p05Probe 与 twoPhaseProbe 共用。
// 用 -Pp05.jbr=<jdk-home> 或 JBR_HOME/JAVA_HOME_DCEVM/JAVA_HOME_21_X64 指定运行时。
def probeIsWindows = System.getProperty("os.name").toLowerCase().contains("win")

/**
 * 先试跑一次，确认目标运行时接受这些 -Xlog 选择器。
 *
 * <p>各 JDK 大版本的 tag 集合并不一致：{@code deoptimization} 在 17 上根本不存在，
 * 写进命令行会让 JVM 直接 "Could not create the Java Virtual Machine" 退出，探针一行输出都没有
 * （CI 的 JBR 17 腿就是这么挂的）。所以这里一律先证明再用——少一路日志可以显式声明，
 * 起不来则整个探针报废。</p>
 *
 * <p><b>一次进程搞定</b>：常态（21+）下四条选择器全支持，把它们塞进同一条命令行试一次即可；
 * 只有失败时才逐条二分。结果按 java 路径缓存，四个探针任务共用一次探测。</p>
 */
def xlogSupportCache = [:]
def runJavaQuietly = { File javaBin, List<String> args ->
	try {
		// 必须逐元素 toString：Groovy 的字符串插值产出 GString，而 ProcessBuilder(List)
		// 不会做逐元素强转，start() 时才抛 ArrayStoreException——被下面的 catch 吞掉后
		// 表现成"这条选择器不支持"，整批日志会被静默跳过。
		def cmd = ([javaBin.absolutePath] + args).collect { it.toString() }
		def p = new ProcessBuilder(cmd).redirectErrorStream(true)
			.redirectOutput(ProcessBuilder.Redirect.DISCARD).start()
		p.waitFor()
		return p.exitValue() == 0
	} catch (Exception ignored) {
		return false
	}
}
def supportedXlog = { File javaBin, List<String> selections ->
	String key = javaBin.absolutePath
	if (xlogSupportCache.containsKey(key)) return xlogSupportCache[key]
	List<String> ok
	def asArgs = { List<String> sel -> sel.collect { "-Xlog:${it}:stdout:uptimenanos".toString() } }
	if (runJavaQuietly(javaBin, asArgs(selections) + ["-version"])) {
		ok = new ArrayList<>(selections)
	} else {
		ok = selections.findAll { runJavaQuietly(javaBin, asArgs([it]) + ["-version"]) }
	}
	xlogSupportCache[key] = ok
	return ok
}

def dcevmProbe = { String taskName, String mainClassName, String desc ->
	tasks.register(taskName, JavaExec) {
		group = "verification"
		description = desc
		dependsOn classes
		dependsOn p05AgentJar
		classpath = sourceSets.main.runtimeClasspath
		mainClass = mainClassName
		maxHeapSize = "1g"
		def jbrHome = (project.findProperty("p05.jbr") as String)
			?: System.getenv("JBR_HOME") ?: System.getenv("JAVA_HOME_DCEVM") ?: System.getenv("JAVA_HOME_21_X64")
		if (jbrHome != null) {
			def javaBin = new File(jbrHome, probeIsWindows ? "bin/java.exe" : "bin/java")
			if (javaBin.exists()) {
				executable = javaBin.absolutePath
				javaLauncher.set((JavaLauncher) null)
			} else {
				logger.lifecycle("[${taskName}] 指定的运行时不存在，回退当前 JVM: " + javaBin.absolutePath)
			}
		}
		doFirst {
			def p05Dir = project.layout.buildDirectory.dir("p05").get().asFile
			p05Dir.mkdirs()

			// 探针实际会用的那个 java：优先显式 executable，其次 toolchain launcher，最后退回 Gradle 自己的 JVM。
			// -Xlog 的选择器要按这个 JVM 探测，不能按跑 Gradle 的那个。
			File probeJava = null
			if (getExecutable() != null) {
				probeJava = new File(getExecutable())
			} else {
				try {
					if (javaLauncher.present) probeJava = javaLauncher.get().executablePath.asFile
				} catch (Exception ignored) { }
			}
			if (probeJava == null || !probeJava.exists()) {
				probeJava = new File(System.getProperty("java.home"), probeIsWindows ? "bin/java.exe" : "bin/java")
			}

			jvmArgs "-javaagent:${p05AgentJar.get().archiveFile.get().asFile.absolutePath}",
			        "-XX:+AllowEnhancedClassRedefinition",
			        // InitFix 的静态初始化直接用 jdk.internal.misc.Unsafe
			        "--add-exports", "java.base/jdk.internal.misc=ALL-UNNAMED",
			        "--add-exports", "java.base/jdk.internal.reflect=ALL-UNNAMED",
			        "--add-exports", "java.base/jdk.internal.loader=ALL-UNNAMED"

			// 交叉验证 M6：枚举期间到底有没有一段 STW
			// 观测先行：safepoint 看停顿、gc 看分配压力、deopt/compilation 验证 JIT 场景不是空转。
			// uptimenanos 装饰符让三类日志能和探针里的 nanoTime 对齐。
			// 逐条探测：不支持的（如 17 上的 deoptimization）跳过，并把缺失项交给探针显式声明。
			def wantedXlog = [['safepoint=info', 'safepoint.log'],
			                  ['gc*=info', 'gc.log'],
			                  ['deoptimization=debug', 'deopt.log'],
			                  ['jit+compilation=debug', 'compilation.log']]
			def supported = supportedXlog(probeJava, wantedXlog.collect { it[0] })
			def skippedXlog = []
			wantedXlog.each { spec ->
				if (supported.contains(spec[0])) {
					jvmArgs "-Xlog:${spec[0]}:file=${new File(p05Dir, spec[1]).absolutePath}:uptimenanos"
				} else {
					skippedXlog << spec[0]
				}
			}
			if (!skippedXlog.isEmpty()) {
				logger.lifecycle("[${taskName}] ${probeJava} 不接受 -Xlog 选择器 ${skippedXlog}，已跳过（探针会声明该路证据缺失）")
				systemProperty "p05.xlog.skipped", skippedXlog.join(",")
			}

			jvmArgs "-Dp05.logdir=${p05Dir.absolutePath}",
			        "-Dfile.encoding=UTF-8", "-Dstdout.encoding=UTF-8", "-Dstderr.encoding=UTF-8"
			if (nativeLibPath != null) {
				jvmArgs "-Dremold.path.libtool=${nativeLibPath}"
			}
			try {
				def j21 = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }.get().executablePath.asFile.absolutePath
				systemProperty "hstest.javac21", j21
			} catch (Exception ignored) {}
		}
	}
}

