// SemAssert 夹具编译
def hstestFixtureRoot = layout.buildDirectory.dir("hstest-fixtures")
def hstestFixtureSpecs = [
	["swap2", "v1", "swap2/Time.java"], ["swap2", "v2", "swap2/Time.java"],
	["leaf",  "v1", null],              ["leaf",  "v2", null], ["leaf", "v3", null],
	["deep",  "v1", "deep/Time.java"],  ["deep",  "v2", "deep/Time.java"],
	["two",   "v1", "two/Time2.java"],  ["two",   "v2", "two/Time2.java"],
	["deep2", "v1", "deep2/Time3.java"],["deep2", "v2", "deep2/Time3.java"], ["deep2", "v3", "deep2/Time3.java"],
	["save3", "v1", "save3/Time4.java"],["save3", "v2", "save3/Time4.java"], ["save3", "v3", "save3/Time4.java"],
]
def hstestFixtureJdk = 21
def hstestFixtureTasks = hstestFixtureSpecs.collect { g, v, helper ->
	tasks.register("hstestFx_${g}_${v}", JavaCompile) {
		group = "verification"
		description = "编译 SemAssert 夹具 ${g}/${v} (jdk${hstestFixtureJdk})"
		source = files(fileTree("${projectDir}/${g}/${v}") { include "**/*.java" },
		               helper ? [file("${projectDir}/${helper}")] : [])
		classpath = files()
		destinationDirectory = hstestFixtureRoot.map { it.dir("jdk${hstestFixtureJdk}/${g}/${v}") }
		javaCompiler = javaToolchains.compilerFor {
			languageVersion = JavaLanguageVersion.of(hstestFixtureJdk)
		}
		options.encoding = "UTF-8"
		options.warnings = false
		options.debug = true
		options.debugOptions.debugLevel = "source,lines"
		sourceCompatibility = "${hstestFixtureJdk}"
		targetCompatibility = "${hstestFixtureJdk}"
	}
}

def detectNativeLib() {
	def os = System.getProperty("os.name").toLowerCase()
	def arch = System.getProperty("os.arch").toLowerCase()
	File lib = null
	if (os.contains("win")) {
		lib = rootProject.file("core/libs/tool64.dll")
	} else if (os.contains("linux")) {
		lib = rootProject.file("core/libs/libtool64.so")
	} else if (os.contains("mac")) {
		lib = (arch.contains("aarch64") || arch.contains("arm")) ?
			rootProject.file("core/libs/libtoolarm64.dylib") :
			rootProject.file("core/libs/libtool64.dylib")
	}
	return (lib != null && lib.exists()) ? lib.absolutePath : null
}
def nativeLibPath = detectNativeLib()

// ------------------------------------------------------------------------------------------------
// 常驻 javac：把服务端编成 v52，让 JDK 8 也能加载
//
// 外部 javac 单次约 2.4s（其中 JVM 启动只占 0.4s，其余是 javac 自己的符号表初始化），
// 复用同一个 JavaCompiler + StandardJavaFileManager 后约 35ms。所以服务端必须**常驻**并复用
// 编译器实例；而它要在 8/11/17/21 各自的进程里跑，字节码只能是 v52。
// ------------------------------------------------------------------------------------------------
def javacDaemonDir = layout.buildDirectory.dir("javacdaemon")
def javacDaemonServer = tasks.register("javacDaemonServer", JavaCompile) {
	group = "build"
	description = "编译常驻 javac 服务端（--release 8，供各 JDK 版本加载）"
	source = fileTree("${projectDir}/javacdaemon") { include "**/*.java" }
	classpath = files()
	destinationDirectory = javacDaemonDir
	options.encoding = "UTF-8"
	// 根项目的 withType(JavaCompile) 会给所有编译任务塞 -AtargetVersion=11 与 --add-exports，
	// 这些在 --release 8 下是非法的（JDK 8 没有这些选项）。服务端是独立的纯 Java 8 小程序，
	// 不需要注解处理器也不需要导出内部包，整组参数在这里清掉。
	options.compilerArgs = ["-Xlint:-options"]
	doFirst {
		options.compilerArgs = options.compilerArgs.findAll {
			!it.startsWith("--add-") && !it.startsWith("-A")
		}
	}
	options.release = 8
	sourceCompatibility = "8"
	targetCompatibility = "8"
}

// 1. JUnit 测试入口
test {
	group = "verification"
	description = "运行 185 项 JUnit 拓扑对齐、Native 实例扫描与安全门测试"
	testClassesDirs = sourceSets.main.output.classesDirs
	classpath = sourceSets.main.runtimeClasspath
	dependsOn classes
	dependsOn project(":core").tasks.named("shadowJar")
	dependsOn project(":panama").tasks.named("jar")
	dependsOn hstestFixtureTasks
	inputs.dir(hstestFixtureRoot)
	// 常驻 javac 服务端：类路径变了要重跑测试（否则可能用着旧协议）。
	dependsOn javacDaemonServer
	inputs.dir(javacDaemonDir)
	systemProperty "hstest.javacDaemon.classpath", javacDaemonDir.get().asFile.absolutePath
	// 逃生口：-Phstest.noJavacDaemon 强制回退外部 javac（怀疑守护进程有问题时用）。
	if (project.hasProperty("hstest.noJavacDaemon")) {
		systemProperty "hstest.javacDaemon", "false"
	}
	useJUnitPlatform()
	// 并行度：默认**串行**。实测（本机 8 核 Windows）4 fork 反而更慢——5m43s vs 串行 5m07s。
	// 瓶颈不是 CPU 而是密集的 `javac` 子进程（每个测试都起外部编译器），多 fork 只是把它们
	// 排到同一批核上互相抢。Linux/CI 上可以试 -Phstest.forks=N；本机排查偶发失败时用 1。
	// 注意：这是 Task 的运行时配置，不作为 input，改它不会让 test 失效重跑（需要 --rerun-tasks）。
	maxParallelForks = (project.findProperty("hstest.forks") ?: 1).toInteger()
	workingDir = projectDir
	// 模拟模板的真实注入方式（见 minecraft-fabric-template/README.md）：标准 JDK 必须靠
	// IgnoreUnrecognizedVMOptions 才能接受 DCEVM 专有参数，而 RuntimeMXBean.getInputArguments()
	// 仍会回显它 —— 这正是 EnhancedHotswapGateTest#probeMatchesRealVmOptionState 要锁住的误判场景。
	jvmArgs "--add-exports", "java.base/jdk.internal.misc=ALL-UNNAMED",
	        "-Dfile.encoding=UTF-8", "-Dstdout.encoding=UTF-8", "-Dstderr.encoding=UTF-8",
	        "-XX:+IgnoreUnrecognizedVMOptions", "-XX:+AllowEnhancedClassRedefinition"
	systemProperty "hstest.fixtures", hstestFixtureRoot.get().asFile.absolutePath
	if (nativeLibPath != null) {
		systemProperty "remold.path.libtool", nativeLibPath
	}

	def requiredJdkMajors = [8, 11, 17, 21, 25]
	doFirst {
		def missing = []
		requiredJdkMajors.each { v ->
			try {
				systemProperty "hstest.javac${v}", javaToolchains.compilerFor {
					languageVersion = JavaLanguageVersion.of(v)
				}.get().executablePath.asFile.absolutePath
			} catch (Exception e) {
				missing << v
			}
		}
		if (!missing.isEmpty()) {
			def msg = "hstestJunit: 缺少 javac toolchain " + missing.join(", ")
			if (!"false".equalsIgnoreCase(System.getProperty("hstest.requireJdks", "true"))) {
				throw new GradleException(msg)
			}
			logger.warn(msg)
		}
	}
}

// 断言测试总数 ≥ 318 且 0 skipped（318 = 2026-10-30 全量实测，含 LayoutPredictorTest 5 个、ReflectionCacheManagerTest 4 个、OffsetScannerTest 4 个、LayoutGateWiringTest 30 个等用例）
def hstestMinTests = 403
tasks.register("verifyTestCount") {
	group = "verification"
	description = "断言 JUnit 测试数不低于基线 ${hstestMinTests}"
	dependsOn tasks.named("test")
	doLast {
		def dir = layout.buildDirectory.dir("test-results/test").get().asFile
		int total = 0
		int skipped = 0
		dir.listFiles()?.each { f ->
			if (f.name.startsWith("TEST-") && f.name.endsWith(".xml")) {
				def text = f.getText("UTF-8")
				def mt = text =~ /<testsuite[^>]*\btests="(\d+)"/
				if (mt.find()) total += (mt.group(1) as int)
				def ms = text =~ /<testsuite[^>]*\bskipped="(\d+)"/
				if (ms.find()) skipped += (ms.group(1) as int)
			}
		}
		if (skipped > 0) {
			throw new GradleException("JUnit 有 " + skipped + " 个 skipped 测试：约定是缺 JDK 就硬失败、不跳过")
		}
		if (total < hstestMinTests) {
			throw new GradleException("JUnit 测试数 " + total + " < 基线 " + hstestMinTests)
		}
		logger.lifecycle("JUnit 测试数 = " + total + ", skipped = " + skipped + " (>= " + hstestMinTests + ")")
	}
}

