// 8. verifyDocStatusMarkers
tasks.register("verifyDocStatusMarkers") {
	group = "verification"
	description = "检查设计规格文档与源码中严禁混入易腐状态标记"
	doLast {
		def checkDirs = [
			file("${rootDir}/docs/initfix"),
			file("${rootDir}/docs/topology"),
			file("${rootDir}/core/src"),
			file("${rootDir}/api/src"),
			file("${rootDir}/plugin-arc/src"),
			file("${rootDir}/plugin-mixin/src"),
			file("${rootDir}/panama/src")
		]
		def pattern = ~/[✅❌⬜🔶🟣]|\[(已实现|未实现|部分实现|已偏离)/
		def violations = []
		checkDirs.each { dir ->
			if (dir.exists()) {
				dir.eachFileRecurse { f ->
					if (f.isFile() && (f.name.endsWith(".md") || f.name.endsWith(".java"))) {
						f.eachLine("UTF-8") { line, lineNum ->
							if (line =~ pattern) {
								violations << "${rootDir.toPath().relativize(f.toPath())}:${lineNum}: ${line.trim()}"
							}
						}
					}
				}
			}
		}
		if (!violations.isEmpty()) {
			throw new GradleException("发现违规混入的实现状态标记：\n" + violations.join("\n"))
		}
		logger.lifecycle("verifyDocStatusMarkers: 全部规范文档与源码均无违规状态标记")
	}
}

