// ------------------------------------------------------------------------------------------------
// 断言型探针的增量与构建缓存
//
// 这几个任务跑完只关心 exit code，是**断言**而不是**测量**，所以可以安全地 up-to-date：
// 输入（classpath / main / Kotlin 夹具目录）没变且上次通过，就没有理由再冷启动一次 JVM。
//
// 测量型探针（p05 / twoPhase / offset / lambdaBridge / readerScan / cacheWarming / alignBaseline）
// 刻意**不**这么做：它们要的是本次运行的真实数字，跳过等于给你一份假数据。要复跑用
// `--rerun-tasks`。
// ------------------------------------------------------------------------------------------------
["mixinProbe", "initFixOracle", "ghostProbe", "concurrencyAssert", "fingerprintAssert"].each { name ->
	tasks.named(name, JavaExec) {
		inputs.files(classpath).withPropertyName("probeClasspath")
		inputs.property("mainClass", mainClass)
		// agent 是显式 -javaagent 传进去的，不在 classpath 里，得单独声明。
		if (name != "initFixOracle") {
			inputs.files(project(":core").tasks.named("shadowJar"))
			      .withPropertyName("agentJar")
		}
		def stamp = layout.buildDirectory.file("probes/${name}.ok")
		outputs.file(stamp)
		doLast {
			def f = stamp.get().asFile
			f.parentFile.mkdirs()
			f.text = "ok\n"
		}
	}
}
// InitFix 的 Kotlin 夹具是独立 sourceSet，走 systemProperty 传路径，不在 classpath 里。
