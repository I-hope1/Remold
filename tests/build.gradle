// DCEVM 探针的公共配置：p05Probe 与 twoPhaseProbe 共用。
// 用 -Pp05.jbr=<jdk-home> 或 JBR_HOME/JAVA_HOME_DCEVM/JAVA_HOME_21_X64 指定运行时。
def probeIsWindows = System.getProperty("os.name").toLowerCase().contains("win")

/**
 * 先试跑一次，确认目标运行时接受这些 -Xlog 选择器。
 *
 * <p>各 JDK 大版本的 tag 集合并不一致：{@code deoptimization} 在 17 上根本不存在，
 * 写进命令行会让 JVM 直接 "Could not create the Java Virtual Machine" 退出，探针一行输出都没有
 * （CI 的 JBR 17 腿就是这么挂的）。所以这里一律先证明再用——少一路日志可以显式声明，
 * 起不来则整个探针报废。</p>
 *
 * <p><b>一次进程搞定</b>：常态（21+）下四条选择器全支持，把它们塞进同一条命令行试一次即可；
 * 只有失败时才逐条二分。结果按 java 路径缓存，四个探针任务共用一次探测。</p>
 */
def xlogSupportCache = [:]
def runJavaQuietly = { File javaBin, List<String> args ->
	try {
		// 必须逐元素 toString：Groovy 的字符串插值产出 GString，而 ProcessBuilder(List)
		// 不会做逐元素强转，start() 时才抛 ArrayStoreException——被下面的 catch 吞掉后
		// 表现成"这条选择器不支持"，整批日志会被静默跳过。
		def cmd = ([javaBin.absolutePath] + args).collect { it.toString() }
		def p = new ProcessBuilder(cmd).redirectErrorStream(true)
			.redirectOutput(ProcessBuilder.Redirect.DISCARD).start()
		p.waitFor()
		return p.exitValue() == 0
	} catch (Exception ignored) {
		return false
	}
}
def supportedXlog = { File javaBin, List<String> selections ->
	String key = javaBin.absolutePath
	if (xlogSupportCache.containsKey(key)) return xlogSupportCache[key]
	List<String> ok
	def asArgs = { List<String> sel -> sel.collect { "-Xlog:${it}:stdout:uptimenanos".toString() } }
	if (runJavaQuietly(javaBin, asArgs(selections) + ["-version"])) {
		ok = new ArrayList<>(selections)
	} else {
		ok = selections.findAll { runJavaQuietly(javaBin, asArgs([it]) + ["-version"]) }
	}
	xlogSupportCache[key] = ok
	return ok
}

def dcevmProbe = { String taskName, String mainClassName, String desc ->
	tasks.register(taskName, JavaExec) {
		group = "verification"
		description = desc
		dependsOn classes
		dependsOn p05AgentJar
		classpath = sourceSets.main.runtimeClasspath
		mainClass = mainClassName
		maxHeapSize = "1g"
		def jbrHome = (project.findProperty("p05.jbr") as String)
			?: System.getenv("JBR_HOME") ?: System.getenv("JAVA_HOME_DCEVM") ?: System.getenv("JAVA_HOME_21_X64")
		if (jbrHome != null) {
			def javaBin = new File(jbrHome, probeIsWindows ? "bin/java.exe" : "bin/java")
			if (javaBin.exists()) {
				executable = javaBin.absolutePath
				javaLauncher.set((JavaLauncher) null)
			} else {
				logger.lifecycle("[${taskName}] 指定的运行时不存在，回退当前 JVM: " + javaBin.absolutePath)
			}
		}
		doFirst {
			def p05Dir = project.layout.buildDirectory.dir("p05").get().asFile
			p05Dir.mkdirs()

			// 探针实际会用的那个 java：优先显式 executable，其次 toolchain launcher，最后退回 Gradle 自己的 JVM。
			// -Xlog 的选择器要按这个 JVM 探测，不能按跑 Gradle 的那个。
			File probeJava = null
			if (getExecutable() != null) {
				probeJava = new File(getExecutable())
			} else {
				try {
					if (javaLauncher.present) probeJava = javaLauncher.get().executablePath.asFile
				} catch (Exception ignored) { }
			}
			if (probeJava == null || !probeJava.exists()) {
				probeJava = new File(System.getProperty("java.home"), probeIsWindows ? "bin/java.exe" : "bin/java")
			}

			jvmArgs "-javaagent:${p05AgentJar.get().archiveFile.get().asFile.absolutePath}",
			        "-XX:+AllowEnhancedClassRedefinition",
			        // InitFix 的静态初始化直接用 jdk.internal.misc.Unsafe
			        "--add-exports", "java.base/jdk.internal.misc=ALL-UNNAMED",
			        "--add-exports", "java.base/jdk.internal.reflect=ALL-UNNAMED",
			        "--add-exports", "java.base/jdk.internal.loader=ALL-UNNAMED"

			// 交叉验证 M6：枚举期间到底有没有一段 STW
			// 观测先行：safepoint 看停顿、gc 看分配压力、deopt/compilation 验证 JIT 场景不是空转。
			// uptimenanos 装饰符让三类日志能和探针里的 nanoTime 对齐。
			// 逐条探测：不支持的（如 17 上的 deoptimization）跳过，并把缺失项交给探针显式声明。
			def wantedXlog = [['safepoint=info', 'safepoint.log'],
			                  ['gc*=info', 'gc.log'],
			                  ['deoptimization=debug', 'deopt.log'],
			                  ['jit+compilation=debug', 'compilation.log']]
			def supported = supportedXlog(probeJava, wantedXlog.collect { it[0] })
			def skippedXlog = []
			wantedXlog.each { spec ->
				if (supported.contains(spec[0])) {
					jvmArgs "-Xlog:${spec[0]}:file=${new File(p05Dir, spec[1]).absolutePath}:uptimenanos"
				} else {
					skippedXlog << spec[0]
				}
			}
			if (!skippedXlog.isEmpty()) {
				logger.lifecycle("[${taskName}] ${probeJava} 不接受 -Xlog 选择器 ${skippedXlog}，已跳过（探针会声明该路证据缺失）")
				systemProperty "p05.xlog.skipped", skippedXlog.join(",")
			}

			jvmArgs "-Dp05.logdir=${p05Dir.absolutePath}",
			        "-Dfile.encoding=UTF-8", "-Dstdout.encoding=UTF-8", "-Dstderr.encoding=UTF-8"
			if (nativeLibPath != null) {
				jvmArgs "-Dremold.path.libtool=${nativeLibPath}"
			}
			try {
				def j21 = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(21) }.get().executablePath.asFile.absolutePath
				systemProperty "hstest.javac21", j21
			} catch (Exception ignored) {}
		}
	}
}

dcevmProbe("p05Probe", "P05Probe",
	"P0.5 前置微验证探针 (P05Probe)：连续 Schema Redefine、阶段 A 预注入链接、百万级堆遍历")

dcevmProbe("twoPhaseProbe", "TwoPhaseProbe",
	"两阶段编排端到端探针 (TwoPhaseProbe)：阶段 A → redefine → 阶段 B 补丁 → 阶段 C redefine")

dcevmProbe("offsetStabilityProbe", "OffsetStabilityProbe",
	"偏移量稳定性与漂移实测探针 (OffsetStabilityProbe)：单类加字段稳定性、父类漂移、Updater破坏与C2逆优化")

dcevmProbe("lambdaBridgeProbe", "LambdaBridgeProbe",
	"删除捕获变量后的老 callsite 行为探针 (LambdaBridgeProbe)：同名异描述符 / 改名 / 加捕获 / 仅改方法体")

// 读者扫描成本探针：不需要 DCEVM，只需要 Instrumentation 来枚举已加载类。
tasks.register("readerScanProbe", JavaExec) {
	group = "verification"
	description = "读者扫描成本探针 (ReaderScanProbe)：纯常量池扫描 vs 方法体精扫，以及三档扫描范围的真实成本"
	dependsOn classes
	dependsOn p05AgentJar
	classpath = sourceSets.main.runtimeClasspath
	mainClass = "ReaderScanProbe"
	maxHeapSize = "1g"
	doFirst {
		jvmArgs "-javaagent:${p05AgentJar.get().archiveFile.get().asFile.absolutePath}",
		        "-Dremold.projectRoot=${rootDir.absolutePath}",
		        "-Dfile.encoding=UTF-8", "-Dstdout.encoding=UTF-8", "-Dstderr.encoding=UTF-8"
	}
}

// 缓存填充探针：验证 transformer 的分组执行顺序，以及缓存里存的是对齐/织入之后的字节。
tasks.register("cacheWarmingProbe", JavaExec) {
	group = "verification"
	description = "缓存填充集成探针 (CacheWarmingProbe)：canRetransform 分组顺序 + 缓存必须是最终字节"
	dependsOn classes
	dependsOn p05AgentJar
	classpath = sourceSets.main.runtimeClasspath
	mainClass = "CacheWarmingProbe"
	doFirst {
		jvmArgs "-javaagent:${p05AgentJar.get().archiveFile.get().asFile.absolutePath}",
		        "-Dfile.encoding=UTF-8", "-Dstdout.encoding=UTF-8", "-Dstderr.encoding=UTF-8"
	}
}

// 对齐基线回归探针：跑 agent 的真实批处理路径，断言喂给 LambdaAligner 的旧基线是哪一份字节码。
// 存在理由：align 本身有大量单测，但"agent 传进来的是什么"一直没覆盖，曾出现
// align(old == new) 静默不做事而全部用例全绿（docs/initfix/08-test-audit.md §10.5）。
// 需要 DCEVM/JBR 才能改 schema：-Pp05.jbr=<jdk-home> 或 JBR_HOME。
def alignProbeRoot = layout.buildDirectory.dir("align-probe")
def alignProbeCompile = ["v1", "v2", "v3"].collect { v ->
	tasks.register("alignProbeCompile_${v}", JavaCompile) {
		source = fileTree("${projectDir}/alignprobe/${v}") { include "**/*.java" }
		classpath = files()
		destinationDirectory = alignProbeRoot.map { it.dir(v) }
		javaCompiler = javaToolchains.compilerFor {
			languageVersion = JavaLanguageVersion.of(21)
		}
		options.encoding = "UTF-8"
		options.warnings = false
	}
}
def alignProbeSetup = tasks.register("alignProbeSetup", Copy) {
	dependsOn alignProbeCompile
	from alignProbeRoot.map { it.dir("v1") }
	into alignProbeRoot.map { it.dir("live") }
}
tasks.register("alignBaselineProbe", JavaExec) {
	group = "verification"
	description = "agent 调用路径回归探针：连续两轮 redefine，断言对齐基线不是上一轮源码字节"
	dependsOn classes
	dependsOn alignProbeSetup
	dependsOn project(":core").tasks.named("shadowJar")
	classpath = sourceSets.main.runtimeClasspath +
		files(alignProbeRoot.map { it.dir("v1") }, alignProbeRoot.map { it.dir("live") })
	mainClass = "AlignBaselineProbe"
	def jbrHome = (project.findProperty("p05.jbr") as String)
		?: System.getenv("JBR_HOME") ?: System.getenv("JAVA_HOME_DCEVM") ?: System.getenv("JAVA_HOME_21_X64")
	if (jbrHome != null) {
		def javaBin = new File(jbrHome, System.getProperty("os.name").toLowerCase().contains("win") ? "bin/java.exe" : "bin/java")
		if (javaBin.exists()) {
			executable = javaBin.absolutePath
			javaLauncher.set((JavaLauncher) null)
		}
	}
	doFirst {
		def liveDir = alignProbeRoot.get().dir("live").asFile
		args = [liveDir.absolutePath,
		        alignProbeRoot.get().dir("v2/T.class").asFile.absolutePath,
		        alignProbeRoot.get().dir("v3/T.class").asFile.absolutePath]
		jvmArgs "-javaagent:${project(':core').tasks.named('shadowJar').get().archiveFile.get().asFile.absolutePath}=${liveDir.absolutePath}",
		        "-XX:+AllowEnhancedClassRedefinition",
		        "--add-exports", "java.base/jdk.internal.loader=ALL-UNNAMED",
		        "--add-exports", "java.base/jdk.internal.misc=ALL-UNNAMED",
		        "-Dfile.encoding=UTF-8", "-Dstdout.encoding=UTF-8", "-Dstderr.encoding=UTF-8"
	}
}

// ------------------------------------------------------------------------------------------------
// 验证分层：日常快检 / 独立进程 E2E / DCEVM 探针
//
// 分层的依据是"要不要额外起 JVM、要不要拉起 Kotlin 编译器"，不是"重不重要"。
// `check` 曾经把下面三档全挂上，于是改一行 Java 也要先编两次 Kotlin、再冷启动 5 个 JVM。
// ------------------------------------------------------------------------------------------------

// 第 1 档（日常）：纯 JUnit + 纯文本扫描，不冷启动额外 JVM、不触发 Kotlin 编译器。
check.dependsOn test
check.dependsOn verifyTestCount
check.dependsOn verifyDocStatusMarkers

// 第 2 档：需要独立 JVM / -javaagent / Kotlin 夹具编译的断言。./gradlew e2eProbe
tasks.register("e2eProbe") {
	group = "verification"
	description = "独立 JVM 与 Agent E2E 断言（含 Kotlin InitFix 差分）：check 之外的第二档"
	dependsOn "mixinProbe"
	dependsOn "initFixOracle"
	// layoutGateAssert 已收编为 JUnit（LayoutGateRulesTest）：它是纯函数规则表，
	// 不碰 Instrumentation，没必要为它冷启动一个 JVM。
	dependsOn "ghostProbe"
	dependsOn "concurrencyAssert"
	dependsOn "fingerprintAssert"
}

// 第 3 档：DCEVM 机制探针。需要 JBR，本来就不参与门禁，聚起来只为方便一键跑。
tasks.register("dcevmProbeSuite") {
	group = "verification"
	description = "全部 DCEVM 机制探针（需要 JBR）：liveDcevmTest / p05 / twoPhase / offset / lambdaBridge / readerScan / cacheWarming / alignBaseline"
	dependsOn "liveDcevmTest"
	dependsOn "p05Probe"
	dependsOn "twoPhaseProbe"
	dependsOn "offsetStabilityProbe"
	dependsOn "lambdaBridgeProbe"
	dependsOn "readerScanProbe"
	dependsOn "cacheWarmingProbe"
	dependsOn "alignBaselineProbe"
}

// 全量门禁：CI 与提交前用这个（第 1 + 2 档）。第 3 档仍按需单跑。
tasks.register("fullCheck") {
	group = "verification"
	description = "check + e2eProbe 全量验证"
	dependsOn check
	dependsOn "e2eProbe"
}

// 兼容旧习惯：./gradlew check -Pfull 等价于 fullCheck
if (project.hasProperty("full")) {
	check.dependsOn "e2eProbe"
}
